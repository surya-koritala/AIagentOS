name: Restricted Phase 1 promotion and publication

# This is the only workflow allowed to publish the restricted Linux CLI
# prerelease. It runs after the tag-triggered build and every protected Phase 1
# qualification, then requires one independently reviewed, digest-bound
# campaign from the repository-owned evidence store.
on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Existing vX.Y.Z-rc.N annotated tag selected as this workflow ref
        required: true
        type: string
      linux_cli_rc_run_id:
        description: Successful Linux CLI RC workflow run ID for the same tag and commit
        required: true
        type: string
      phase1_campaign_run_id:
        description: Successful authenticated Phase 1 campaign workflow run ID
        required: true
        type: string
      phase1_review_run_id:
        description: Successful authenticated independent-review workflow run ID
        required: true
        type: string
      environment_id:
        description: Stable target deployment identifier used by durability and SLO evidence
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-promotion-${{ inputs.release_candidate }}
  cancel-in-progress: false

env:
  AGENTOS_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
  AGENTOS_QUALIFICATION_ENVIRONMENT: ${{ inputs.environment_id }}
  LINUX_CLI_RC_RUN_ID: ${{ inputs.linux_cli_rc_run_id }}
  PHASE1_CAMPAIGN_RUN_ID: ${{ inputs.phase1_campaign_run_id }}
  PHASE1_REVIEW_RUN_ID: ${{ inputs.phase1_review_run_id }}

jobs:
  qualification-plan:
    name: Fail-closed Phase 1 promotion preflight
    uses: ./.github/workflows/protected-qualification-plan.yml
    with:
      profile: phase1-promotion
      enabled: ${{ vars.AGENTOS_CAPACITY_QUALIFICATION_ENABLED }}

  exact-release-candidate-promotion:
    name: Exact-RC independently reviewed Phase 1 decision
    needs: qualification-plan
    if: needs.qualification-plan.outputs.ready == 'true'
    runs-on: [self-hosted, linux, x64, agentos-capacity]
    timeout-minutes: 20
    environment: capacity-qualification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_candidate }}
          fetch-depth: 0
      - name: Validate the checked-in promotion and runtime contracts
        run: |
          python3 scripts/phase1_campaign_provenance.py --validate
          python3 scripts/phase1_promotion_qualification.py --validate
          python3 scripts/phase1_workflow_provenance.py --validate
          python3 scripts/phase1_review_provenance.py --validate
          python3 scripts/linux_cli_rc_qualification.py --help >/dev/null
      - name: Bind dispatch, annotated tag, checkout, and release candidate
        run: |
          [[ "$AGENTOS_RELEASE_CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/tags/${AGENTOS_RELEASE_CANDIDATE}"
          test "$(git cat-file -t "$AGENTOS_RELEASE_CANDIDATE")" = "tag"
          test "$(git rev-list -n 1 "$AGENTOS_RELEASE_CANDIDATE")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Authenticate the originating signed CLI workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$LINUX_CLI_RC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          metadata="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${LINUX_CLI_RC_RUN_ID}")"
          test "$(jq -r '.path | split("@")[0]' <<<"$metadata")" = \
            ".github/workflows/linux-cli-rc.yml"
          test "$(jq -r .event <<<"$metadata")" = "push"
          test "$(jq -r .head_sha <<<"$metadata")" = "$GITHUB_SHA"
          test "$(jq -r .status <<<"$metadata")" = "completed"
          test "$(jq -r .conclusion <<<"$metadata")" = "success"
      - name: Download the exact authenticated Phase 1 campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PHASE1_CAMPAIGN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          campaign_dir=target/phase1/campaign/artifact
          mkdir -p "$campaign_dir" target/phase1/campaign/metadata
          current="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_CAMPAIGN_RUN_ID}")"
          test "$(jq -r .run_attempt <<<"$current")" = "1"
          test "$(jq -r '.path | split("@")[0]' <<<"$current")" = \
            ".github/workflows/phase1-campaign-assembly.yml"
          test "$(jq -r .event <<<"$current")" = "workflow_dispatch"
          test "$(jq -r .head_sha <<<"$current")" = "$GITHUB_SHA"
          test "$(jq -r .status <<<"$current")" = "completed"
          test "$(jq -r .conclusion <<<"$current")" = "success"
          artifact_name="phase1-campaign-${AGENTOS_RELEASE_CANDIDATE}-${GITHUB_SHA}"
          gh run download "$PHASE1_CAMPAIGN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$campaign_dir"
          python3 scripts/phase1_campaign_provenance.py \
            --campaign "$campaign_dir/campaign.json" \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --plan-output target/phase1/campaign/plan.json
          metadata_file="$(jq -r .run.metadata_file \
            target/phase1/campaign/plan.json)"
          [[ "$metadata_file" =~ ^[1-9][0-9]*-1\.json$ ]]
          gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_CAMPAIGN_RUN_ID}/attempts/1" \
            > "target/phase1/campaign/metadata/${metadata_file}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate campaign workflow, bytes, and signature
        run: |
          plan=target/phase1/campaign/plan.json
          metadata_file="$(jq -r .run.metadata_file "$plan")"
          python3 scripts/phase1_campaign_provenance.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --plan "$plan" \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata \
              "target/phase1/campaign/metadata/${metadata_file}" \
            --artifact-dir target/phase1/campaign/artifact \
            --output target/qualification/phase1-campaign-provenance.json
      - name: Download the exact authenticated independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PHASE1_REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          review_dir=target/phase1/review/artifact
          mkdir -p "$review_dir" target/phase1/review/metadata
          current="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_REVIEW_RUN_ID}")"
          test "$(jq -r .run_attempt <<<"$current")" = "1"
          test "$(jq -r '.path | split("@")[0]' <<<"$current")" = \
            ".github/workflows/phase1-independent-review.yml"
          test "$(jq -r .event <<<"$current")" = "workflow_dispatch"
          test "$(jq -r .head_sha <<<"$current")" = "$GITHUB_SHA"
          test "$(jq -r .status <<<"$current")" = "completed"
          test "$(jq -r .conclusion <<<"$current")" = "success"
          artifact_name="phase1-independent-review-${AGENTOS_RELEASE_CANDIDATE}-${GITHUB_SHA}"
          gh run download "$PHASE1_REVIEW_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$review_dir"
          python3 scripts/phase1_review_provenance.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --review "$review_dir/phase1-review.json" \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-review-run-id "$PHASE1_REVIEW_RUN_ID" \
            --plan-output target/phase1/review/plan.json
          metadata_file="$(jq -r .run.metadata_file \
            target/phase1/review/plan.json)"
          [[ "$metadata_file" =~ ^[1-9][0-9]*-1\.json$ ]]
          gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_REVIEW_RUN_ID}/attempts/1" \
            > "target/phase1/review/metadata/${metadata_file}"
      - name: Authenticate reviewer identity, workflow, bytes, and signature
        run: |
          plan=target/phase1/review/plan.json
          metadata_file="$(jq -r .run.metadata_file "$plan")"
          python3 scripts/phase1_review_provenance.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --review target/phase1/review/artifact/phase1-review.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-review-run-id "$PHASE1_REVIEW_RUN_ID" \
            --plan "$plan" \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata "target/phase1/review/metadata/${metadata_file}" \
            --artifact-dir target/phase1/review/artifact \
            --output target/qualification/phase1-review-provenance.json
      - name: Build the exact GitHub provenance request plan
        run: |
          mkdir -p target/phase1/provenance
          python3 scripts/phase1_workflow_provenance.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-linux-cli-run-id "$LINUX_CLI_RC_RUN_ID" \
            --plan-output target/phase1/provenance/plan.json
      - name: Authenticate every workflow attempt and download every report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=target/phase1/provenance/plan.json
          run_dir=target/phase1/provenance/runs
          artifact_dir=target/phase1/provenance/artifacts
          mkdir -p "$run_dir" "$artifact_dir"
          jq -r '.runs[] | [
            .run_id,
            .run_attempt,
            .metadata_file
          ] | @tsv' "$plan" |
            while IFS=$'\t' read -r run_id run_attempt metadata_file; do
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
              [[ "$metadata_file" =~ ^[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
              current="$(gh api \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              test "$(jq -r .run_attempt <<<"$current")" = "$run_attempt"
              gh api \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}" \
                > "${run_dir}/${metadata_file}"
            done
          jq -r '.artifacts[] | [
            .run_id,
            .artifact_name,
            .download_subdir
          ] | @tsv' "$plan" |
            while IFS=$'\t' read -r run_id artifact_name download_subdir; do
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$artifact_name" =~ ^[A-Za-z0-9._-]+$ ]]
              [[ "$download_subdir" =~ ^[A-Za-z0-9._-]+$ ]]
              gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" \
                --dir "${artifact_dir}/${download_subdir}"
            done
          python3 scripts/phase1_workflow_provenance.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-linux-cli-run-id "$LINUX_CLI_RC_RUN_ID" \
            --plan "$plan" \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata-dir "$run_dir" \
            --artifact-download-dir "$artifact_dir" \
            --evidence-dir target/phase1/campaign/artifact \
            --output target/qualification/phase1-workflow-provenance.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-linux-cli-rc-bundle
          path: target/phase1/linux-cli
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.linux_cli_rc_run_id }}
      - name: Revalidate exact signed runtime report and protected copy
        run: |
          report=target/phase1/linux-cli/linux-cli-rc-qualification.json
          evidence_report=target/phase1/campaign/artifact/linux-cli-rc-qualification.json
          cmp "$report" "$evidence_report"
          archive="target/phase1/linux-cli/agentos-${AGENTOS_RELEASE_CANDIDATE}-x86_64-unknown-linux-gnu.zip"
          python3 scripts/linux_cli_rc_qualification.py validate-report \
            --report "$report" \
            --archive "$archive" \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --commit "$GITHUB_SHA" \
            --release-registry tests/fixtures/storage/releases.toml \
            --released-schema-tag v0.3.0
      - name: Require one exact independently reviewed Phase 1 decision
        run: |
          mkdir -p target/qualification
          python3 scripts/phase1_promotion_qualification.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --campaign-provenance \
              target/qualification/phase1-campaign-provenance.json \
            --review target/phase1/review/artifact/phase1-review.json \
            --review-provenance \
              target/qualification/phase1-review-provenance.json \
            --workflow-provenance \
              target/qualification/phase1-workflow-provenance.json \
            --evidence-dir target/phase1/campaign/artifact \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --output target/qualification/phase1-promotion.json \
            --require-eligible
      - name: Publish bounded decision summary
        if: always()
        run: |
          {
            printf '### Restricted Phase 1 promotion\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Release candidate: `%s`\n' \
              "$AGENTOS_RELEASE_CANDIDATE"
            if test -f target/qualification/phase1-promotion.json; then
              printf -- '- Phase 1 ready: `%s`\n' \
                "$(jq -r .phase1_release_candidate_ready \
                  target/qualification/phase1-promotion.json)"
              printf -- '- Promoted providers: `%s`\n' \
                "$(jq -r '.promoted_providers | join(",")' \
                  target/qualification/phase1-promotion.json)"
              printf -- '- Whole-product production claim: `%s`\n' \
                "$(jq -r .production_claim_allowed \
                  target/qualification/phase1-promotion.json)"
            else
              printf -- '- Status: `failed before decision publication`\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: phase1-promotion-${{ inputs.release_candidate }}-${{ github.sha }}
          path: |
            target/qualification/phase1-promotion.json
            target/qualification/phase1-campaign-provenance.json
            target/qualification/phase1-workflow-provenance.json
            target/qualification/phase1-review-provenance.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish independently qualified signed prerelease
    needs: exact-release-candidate-promotion
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_candidate }}
          fetch-depth: 0
      - name: Rebind publication to the exact annotated tag
        run: |
          test "$GITHUB_REF" = "refs/tags/${AGENTOS_RELEASE_CANDIDATE}"
          test "$(git cat-file -t "$AGENTOS_RELEASE_CANDIDATE")" = "tag"
          test "$(git rev-list -n 1 "$AGENTOS_RELEASE_CANDIDATE")" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-linux-cli-rc-bundle
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.linux_cli_rc_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase1-promotion-${{ inputs.release_candidate }}-${{ github.sha }}
          path: phase1-report
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase1-campaign-${{ inputs.release_candidate }}-${{ github.sha }}
          path: phase1-campaign
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.phase1_campaign_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase1-independent-review-${{ inputs.release_candidate }}-${{ github.sha }}
          path: phase1-independent-review
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.phase1_review_run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Revalidate the exact promotion decision before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=phase1-report/phase1-promotion.json
          test "$(jq -r .schema_version "$report")" = "1"
          test "$(jq -r .qualification_class "$report")" = \
            "restricted_phase1_promotion_decision"
          test "$(jq -r .release_candidate "$report")" = \
            "$AGENTOS_RELEASE_CANDIDATE"
          test "$(jq -r .source.commit "$report")" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty "$report")" = "false"
          test "$(jq -r .status "$report")" = "passed"
          test "$(jq -r .phase1_release_candidate_ready "$report")" = "true"
          test "$(jq -r .production_claim_allowed "$report")" = "false"
          test "$(jq '.eligibility_blockers | length' "$report")" = "0"
          campaign_provenance=phase1-report/phase1-campaign-provenance.json
          test "$(jq -r .github_campaign_workflow_provenance_verified \
            "$campaign_provenance")" = "true"
          test "$(jq -r .github_campaign_artifact_bytes_verified \
            "$campaign_provenance")" = "true"
          test "$(jq -r .keyless_campaign_signature_verified \
            "$campaign_provenance")" = "true"
          test "$(jq -r .production_claim_allowed \
            "$campaign_provenance")" = "false"
          test "$(jq -r .evidence.campaign_provenance_sha256 "$report")" = \
            "$(sha256sum "$campaign_provenance" | cut -d ' ' -f 1)"
          test "$(sha256sum phase1-campaign/campaign.json | cut -d ' ' -f 1)" = \
            "$(jq -r .evidence.campaign_sha256 "$report")"
          mkdir -p phase1-campaign-publisher
          python3 scripts/phase1_campaign_provenance.py \
            --campaign phase1-campaign/campaign.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --plan-output phase1-campaign-publisher/plan.json
          gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_CAMPAIGN_RUN_ID}/attempts/1" \
            > phase1-campaign-publisher/run.json
          python3 scripts/phase1_campaign_provenance.py \
            --campaign phase1-campaign/campaign.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --plan phase1-campaign-publisher/plan.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata phase1-campaign-publisher/run.json \
            --artifact-dir phase1-campaign \
            --output phase1-campaign-publisher/provenance.json
          for field in repository release_candidate campaign_sha256 \
            campaign_signature_bundle_sha256; do
              test "$(jq -r --arg field "$field" '.[$field]' \
                "$campaign_provenance")" = \
                "$(jq -r --arg field "$field" '.[$field]' \
                  phase1-campaign-publisher/provenance.json)"
          done
          test "$(jq -S .campaign_workflow "$campaign_provenance")" = \
            "$(jq -S .campaign_workflow \
              phase1-campaign-publisher/provenance.json)"
          provenance=phase1-report/phase1-workflow-provenance.json
          test "$(jq -r .github_workflow_provenance_verified "$provenance")" = "true"
          test "$(jq -r .github_artifact_bytes_verified "$provenance")" = "true"
          test "$(jq -r .production_claim_allowed "$provenance")" = "false"
          test "$(jq -r .evidence.workflow_provenance_sha256 "$report")" = \
            "$(sha256sum "$provenance" | cut -d ' ' -f 1)"
          review_provenance=phase1-report/phase1-review-provenance.json
          test "$(jq -r .reviewer_identity_authenticated \
            "$review_provenance")" = "true"
          test "$(jq -r .github_review_workflow_provenance_verified \
            "$review_provenance")" = "true"
          test "$(jq -r .github_review_artifact_bytes_verified \
            "$review_provenance")" = "true"
          test "$(jq -r .keyless_review_signature_verified \
            "$review_provenance")" = "true"
          test "$(jq -r .production_claim_allowed \
            "$review_provenance")" = "false"
          test "$(jq -r .evidence.independent_review_provenance_sha256 \
            "$report")" = \
            "$(sha256sum "$review_provenance" | cut -d ' ' -f 1)"
          review=phase1-independent-review/phase1-review.json
          review_bundle="${review}.sigstore.json"
          test "$(jq -r .schema_version "$review")" = "2"
          test "$(jq -r .qualification_class "$review")" = \
            "independent_restricted_phase1_promotion_review"
          test "$(jq -r .release_candidate "$review")" = \
            "$AGENTOS_RELEASE_CANDIDATE"
          test "$(jq -r .source.commit "$review")" = "$GITHUB_SHA"
          test "$(jq -r .campaign_sha256 "$review")" = \
            "$(jq -r .evidence.campaign_sha256 "$report")"
          test "$(jq -r .decision "$review")" = "approved"
          test "$(jq '[.checks[]] | all' "$review")" = "true"
          test "$(jq '.open_findings | length' "$review")" = "0"
          test "$(sha256sum "$review" | cut -d ' ' -f 1)" = \
            "$(jq -r .independent_review_sha256 "$review_provenance")"
          test "$(sha256sum "$review" | cut -d ' ' -f 1)" = \
            "$(jq -r .evidence.independent_review_sha256 "$report")"
          test "$(jq -r .review_workflow.run_id "$review")" = \
            "$PHASE1_REVIEW_RUN_ID"
          test "$(jq -r .review_workflow.run_attempt "$review")" = "1"
          test "$(jq -r .review_workflow.repository "$review")" = \
            "$GITHUB_REPOSITORY"
          test "$(jq -r .review_workflow.workflow_path "$review")" = \
            ".github/workflows/phase1-independent-review.yml"
          test "$(jq -r .review_workflow.event "$review")" = \
            "workflow_dispatch"
          test "$(jq -r .review_workflow.head_sha "$review")" = "$GITHUB_SHA"
          reviewer="$(jq -r .reviewer_id "$review")"
          [[ "$reviewer" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          reviewer_lower="$(tr '[:upper:]' '[:lower:]' <<<"$reviewer")"
          test "$(jq --arg reviewer "$reviewer_lower" \
            '[.operator_ids[] | ascii_downcase] | index($reviewer) == null' \
            "$review")" = "true"
          case "$reviewer_lower" in
            github-actions|agentos|qualification-harness|unknown)
              echo "Reviewer identity is reserved" >&2
              exit 1
              ;;
          esac
          metadata="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_REVIEW_RUN_ID}/attempts/1")"
          test "$(jq -r .id <<<"$metadata")" = "$PHASE1_REVIEW_RUN_ID"
          test "$(jq -r .run_attempt <<<"$metadata")" = "1"
          test "$(jq -r '.path | split("@")[0]' <<<"$metadata")" = \
            ".github/workflows/phase1-independent-review.yml"
          test "$(jq -r .event <<<"$metadata")" = "workflow_dispatch"
          test "$(jq -r .head_sha <<<"$metadata")" = "$GITHUB_SHA"
          test "$(jq -r .status <<<"$metadata")" = "completed"
          test "$(jq -r .conclusion <<<"$metadata")" = "success"
          test "$(jq -r .repository.full_name <<<"$metadata")" = \
            "$GITHUB_REPOSITORY"
          test "$(jq -r .head_repository.full_name <<<"$metadata")" = \
            "$GITHUB_REPOSITORY"
          test "$(jq -r .actor.login <<<"$metadata" | tr '[:upper:]' '[:lower:]')" = \
            "$reviewer_lower"
          test "$(jq -r .triggering_actor.login <<<"$metadata" | tr '[:upper:]' '[:lower:]')" = \
            "$reviewer_lower"
          review_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/phase1-independent-review.yml@refs/tags/${AGENTOS_RELEASE_CANDIDATE}"
          cosign verify-blob \
            --bundle "$review_bundle" \
            --certificate-identity "$review_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$review"
          cp "$report" "$campaign_provenance" "$provenance" \
            "$review_provenance" dist/
      - name: Verify the originating workflow signatures
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/linux-cli-rc.yml@refs/tags/${AGENTOS_RELEASE_CANDIDATE}"
          for asset in dist/*.zip dist/*.cdx.json \
            dist/linux-cli-rc-qualification.json dist/SHA256SUMS; do
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$asset"
          done
      - name: Replace preliminary manifests with the complete Phase 1 set
        run: |
          find dist -maxdepth 1 -type f -name '*.sigstore.json' -delete
          rm dist/SHA256SUMS
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Keyless-sign every final artifact and checksum manifest
        run: |
          find dist -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 |
            while IFS= read -r -d '' asset; do
              cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
            done
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.zip
            dist/*.cdx.json
            dist/linux-cli-rc-qualification.json
            dist/phase1-promotion.json
            dist/phase1-campaign-provenance.json
            dist/phase1-workflow-provenance.json
            dist/phase1-review-provenance.json
            dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independently-qualified-linux-cli-rc-bundle
          path: dist
          if-no-files-found: error
      - name: Extract matching release-candidate notes
        run: |
          version="${AGENTOS_RELEASE_CANDIDATE#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Create immutable GitHub prerelease from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$AGENTOS_RELEASE_CANDIDATE" dist/* \
            --title "$AGENTOS_RELEASE_CANDIDATE — restricted Linux CLI RC" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --verify-tag
