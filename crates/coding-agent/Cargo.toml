[package]
name = "coding-agent"
description = "Bounded repository-maintenance client using governed AIagentOS execution branches and operator-reviewed changes."
version = "0.4.0-rc.1"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agent-code"
path = "src/main.rs"

[dependencies]
kernel = { path = "../kernel", version = "=0.4.0-rc.1" }
agent-sdk = { path = "../sdk", version = "=0.4.0-rc.1" }
adapters = { path = "../adapters", version = "=0.4.0-rc.1" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
wiremock = { workspace = true }
