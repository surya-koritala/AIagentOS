name: Bounded image input conformance

on:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'crates/**'
      - 'protocol/**'
      - 'scripts/verify_wire_fixtures.py'
      - 'scripts/tests/test_verify_wire_fixtures.py'
      - '.github/workflows/image-input.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  conformance:
    name: Image input boundary and replay fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Formatting gate and repair artifact
        id: format
        continue-on-error: true
        run: |
          if ! cargo fmt --all -- --check > rustfmt-check.txt 2>&1; then
            cat rustfmt-check.txt
            cargo fmt --all
            git diff --binary > rustfmt.patch
            exit 1
          fi
      - name: Exact versioned wire declaration
        run: python -m unittest discover -s scripts/tests -p test_verify_wire_fixtures.py
      - name: Typed image boundaries, durable runtime and actual public clients
        timeout-minutes: 15
        run: cargo test -p kernel -p adapters -p integration-tests -p agent-cli --locked image_input
      - name: Preserve exhaustive authorization and schema guards
        run: |
          cargo test -p kernel --locked authorization_policy_classifies_every_syscall_and_agent_resource
          cargo test -p kernel --locked generated_request_fixtures_cover_every_operation
      - name: All adapter modes and protocols without live credentials
        run: cargo test -p adapters --all-features --locked
      - name: Require formatted source
        if: always() && steps.format.outcome != 'success'
        run: exit 1
      - name: Retain exact source and actual fixture diagnostics
        if: always()
        run: git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: image-input-diagnostics-${{ github.sha }}
          path: |
            source-commit.txt
            rustfmt-check.txt
            rustfmt.patch
          retention-days: 30
