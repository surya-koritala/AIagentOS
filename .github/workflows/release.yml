name: Release qualification and publication

on:
  push:
    tags:
      - "v*"
      - "!v*-rc.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  ARTIFACT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('qualification-{0}', github.run_number) }}

jobs:
  required-ci:
    name: Full release-blocking CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  wedge:
    name: Governed-execution acceptance
    needs: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Off the PR critical path; restore only, never consume cache budget.
          save-if: false
      - name: Reject any unexpected governance result
        run: cargo run --release --locked --package os-benchmark --bin governance-demo

  desktop-release-contract:
    name: Desktop release contract
    needs: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify synchronized versions and platform assets
        run: python3 scripts/verify_desktop_release.py
      - name: Block public tags until native signing and clean-host qualification land
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error title=Desktop publication is not qualified::Native platform signing, notarization, clean-host install/upgrade/failed-update/rollback evidence, and the supported-platform matrix remain release blockers under issue #126."
          exit 1

  desktop-artifacts:
    name: Qualification installers (${{ matrix.platform }})
    needs: [required-ci, desktop-release-contract]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb,appimage
            perl: perl
          - runner: macos-15-intel
            platform: macos-x86_64
            bundles: app,dmg
            perl: perl
          - runner: windows-latest
            platform: windows-x86_64
            bundles: msi,nsis
            perl: C:/Strawberry/perl/bin/perl.exe
    runs-on: ${{ matrix.runner }}
    env:
      OPENSSL_SRC_PERL: ${{ matrix.perl }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: crates/tauri-app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Off the PR critical path; restore only, never consume cache budget.
          save-if: false
      - name: Install Linux desktop bundling prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev
          patchelf xdg-utils
      - name: Install pinned Tauri release CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build production frontend
        working-directory: crates/tauri-app/ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Recheck exact release metadata
        run: python3 scripts/verify_desktop_release.py
      - name: Require the protected updater signing identity
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Build native qualification installers and signed update artifacts
        working-directory: crates/tauri-app
        run: cargo tauri build --ci --bundles "${{ matrix.bundles }}"
      - name: Collect native installers and their updater signatures
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux)
              find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.deb.sig' -o -name '*.AppImage.sig' \) -exec cp {} dist/ \;
              ;;
            macOS)
              find target/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} dist/ \;
              ;;
            Windows)
              find target/release/bundle -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' \) -exec cp {} dist/ \;
              ;;
          esac
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.sig' -print -quit)"
          for signature in dist/*.sig; do
            test -f "${signature%.sig}"
          done
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate desktop bundle CycloneDX SBOM
        run: >-
          syft dir:target/release/bundle
          -o "cyclonedx-json=dist/agentos-${ARTIFACT_VERSION}-desktop-${{ matrix.platform }}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release-artifacts:
    name: Reproducible binaries (${{ matrix.target }})
    needs: required-ci
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
            perl: perl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
            perl: perl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"
            perl: C:/Strawberry/perl/bin/perl.exe
    runs-on: ${{ matrix.runner }}
    env:
      OPENSSL_SRC_PERL: ${{ matrix.perl }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Off the PR critical path; restore only, never consume cache budget.
          save-if: false
      - name: Set deterministic build inputs
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          rustflags="--remap-path-prefix=${GITHUB_WORKSPACE}=."
          if [[ "${{ matrix.target }}" == *-pc-windows-msvc ]]; then
            # link.exe otherwise writes the current time into the PE/COFF header.
            # /Brepro replaces it with deterministic content derived from the image.
            rustflags="${rustflags} -C link-arg=/Brepro"
          fi
          echo "RUSTFLAGS=${rustflags}" >> "$GITHUB_ENV"
      - name: Build twice from clean target directories at one stable path
        run: |
          CARGO_TARGET_DIR=target-repro cargo build --release --locked --target "${{ matrix.target }}" -p agent-cli --bins -p agent-tui
          mv target-repro target-a
          CARGO_TARGET_DIR=target-repro cargo build --release --locked --target "${{ matrix.target }}" -p agent-cli --bins -p agent-tui
      - name: Prove binaries are byte-for-byte reproducible
        run: |
          reproducible=1
          for binary in agent agent-server agent-tui agentctl; do
            first="target-a/${{ matrix.target }}/release/${binary}${{ matrix.extension }}"
            second="target-repro/${{ matrix.target }}/release/${binary}${{ matrix.extension }}"
            if ! cmp -s "$first" "$second"; then
              echo "::error title=Non-reproducible release binary::${binary}${{ matrix.extension }} differs between isolated builds"
              sha256sum "$first" "$second"
              cmp -l "$first" "$second" | head -n 20 || true
              reproducible=0
            fi
          done
          test "$reproducible" = "1"
      - name: Create deterministic archive
        run: |
          mkdir -p dist/stage
          for binary in agent agent-server agent-tui agentctl; do
            cp "target-a/${{ matrix.target }}/release/${binary}${{ matrix.extension }}" dist/stage/
          done
          artifact="agentos-${ARTIFACT_VERSION}-${{ matrix.target }}.zip"
          python - "$artifact" <<'PY'
          import pathlib, stat, sys, zipfile
          name = sys.argv[1]
          root = pathlib.Path("dist/stage")
          with zipfile.ZipFile(pathlib.Path("dist") / name, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.iterdir()):
                  info = zipfile.ZipInfo(path.name, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | 0o755) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes())
          PY
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate CycloneDX SBOM
        run: |
          artifact="agentos-${ARTIFACT_VERSION}-${{ matrix.target }}"
          syft dir:dist/stage -o "cyclonedx-json=dist/${artifact}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.cdx.json
          if-no-files-found: error

  container:
    name: Container qualification
    needs: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned-base agent-server image
        run: docker build --pull -t agentos:${ARTIFACT_VERSION} .
      - name: Verify non-root boot and durable application data
        run: |
          docker volume create agentos-release-data
          docker run -d --name agentos-release -p 127.0.0.1:7777:7777 \
            -e AGENT_SERVER_ALLOW_INSECURE_REMOTE=1 -v agentos-release-data:/data \
            agentos:${ARTIFACT_VERSION} agent-server 0.0.0.0:7777
          for i in $(seq 1 30); do
            if printf '{"op":"node_info"}\n' | nc -w2 127.0.0.1 7777 | grep -q '"status":"node_info"'; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "${healthy:-0}" = "1"
          test "$(docker exec agentos-release id -u)" = "10001"
          create_reply="$(printf '{"op":"create_agent","name":"release-persistence","task":"qualification","provider":"stub","profile":"standard","priority":3}\n' | nc -w5 127.0.0.1 7777)"
          agent_id="$(jq -er 'select(.status == "agent_created") | .id' <<< "$create_reply")"
          put_reply="$(printf '{"op":"storage_put","agent_id":"%s","key":"release-proof","value":"survived"}\n' "$agent_id" | nc -w5 127.0.0.1 7777)"
          test "$(jq -r .status <<< "$put_reply")" = "storage_ok"
          docker restart agentos-release
          for i in $(seq 1 30); do
            if printf '{"op":"node_info"}\n' | nc -w2 127.0.0.1 7777 | grep -q '"status":"node_info"'; then
              restarted=1
              break
            fi
            sleep 1
          done
          test "${restarted:-0}" = "1"
          get_reply="$(printf '{"op":"storage_get","agent_id":"%s","key":"release-proof"}\n' "$agent_id" | nc -w5 127.0.0.1 7777)"
          test "$(jq -r .status <<< "$get_reply")" = "storage_value"
          test "$(jq -r .value <<< "$get_reply")" = "survived"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate container SPDX SBOM
        run: syft agentos:${ARTIFACT_VERSION} -o spdx-json=agentos-${ARTIFACT_VERSION}-container.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-container
          path: agentos-${{ env.ARTIFACT_VERSION }}-container.spdx.json
          if-no-files-found: error
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker logs agentos-release || true
          docker rm -f agentos-release || true
          docker volume rm agentos-release-data || true

  assemble:
    name: Checksums, signatures, and provenance
    needs:
      [required-ci, wedge, desktop-artifacts, release-artifacts, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build strict static updater metadata for a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > UPDATE_NOTES.md
          test -s UPDATE_NOTES.md
          python3 scripts/build_desktop_update_manifest.py \
            --dist dist \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file UPDATE_NOTES.md \
            --pub-date "$(git show -s --format=%cI HEAD)" \
            --output dist/latest.json
      - name: Generate SHA-256 manifest
        working-directory: dist
        run: >-
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0
          | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign every artifact and checksum manifest
        run: |
          find dist -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 |
            while IFS= read -r -d '' asset; do
              cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
            done
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-bundle
          path: dist
          if-no-files-found: error

  publish:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-bundle
          path: dist
      - name: Extract matching changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Create GitHub release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
