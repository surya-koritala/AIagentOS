[[capability]]
id = "sandbox-isolation"
title = "Agent sandbox policy and capability-mediated I/O"
owner = "security"
maturity = "integrated"
release = "v0.5"
tracking_issue = 111
kernel_modules = ["docker_sandbox", "resources", "sandbox"]
source_paths = ["crates/kernel/src/docker_sandbox.rs", "crates/kernel/src/resources.rs", "crates/kernel/src/sandbox.rs"]
public_entry_points = ["crates/kernel/src/lib.rs::SandboxConfig"]
runtime_call_paths = ["crates/kernel/src/resources.rs::ResourceBrokerImpl::execute", "crates/kernel/src/lib.rs::AgentKernelImpl::create_agent_full"]
test_evidence = ["crates/kernel/src/docker_sandbox.rs", "crates/kernel/src/resources.rs", "crates/kernel/src/sandbox.rs", "tests/src/sandbox_props.rs", "tests/src/lifecycle_coordinator.rs"]
platforms = ["linux", "macos", "windows"]
limitations = ["Sandbox identity is mandatory at the live ResourceBroker boundary. Non-trusted filesystem I/O is directory-capability relative with ownership/quota checks and symlink-swap regression coverage. HTTP resolves and pins only public answers, disables ambient proxies/redirects, and restricts ports. Linux container execution requires rootless Docker and a verified digest-pinned image with a hardened run contract; it still needs live breakout and crash qualification. Native Process mode, direct host MCP launch, and unisolated browser execution fail closed. macOS/Windows process/container backends and independent security review remain outstanding under #111/#127."]

