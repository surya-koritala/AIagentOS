[package]
name = "tauri-app"
version = "0.3.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tauri-app"
path = "src/main.rs"
required-features = ["desktop-shell"]

[features]
default = ["desktop-shell"]
desktop-shell = ["dep:adapters", "dep:tauri", "dep:tauri-build"]

[dependencies]
kernel = { path = "../kernel", version = "=0.3.0" }
agent-sdk = { path = "../sdk", version = "=0.3.0" }
adapters = { path = "../adapters", version = "=0.3.0", optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tauri = { workspace = true, features = ["devtools"], optional = true }
tracing = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true, optional = true }
