name: Workspace recovery resolution

on:
  push:
    branches: [codex/workspace-recovery-resolution]
    paths:
      - '.github/workflows/workspace-recovery-resolution.yml'
      - 'crates/kernel/src/**'
      - 'crates/cli/src/bin/agentctl.rs'
      - 'crates/cli/tests/storage_commands.rs'
      - 'crates/cli/tests/workspace_ownership_commands.rs'
      - 'tests/src/managed_workspace_ownership.rs'
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/workspace-recovery-resolution.yml'
      - 'crates/kernel/src/**'
      - 'crates/cli/src/bin/agentctl.rs'
      - 'crates/cli/tests/storage_commands.rs'
      - 'crates/cli/tests/workspace_ownership_commands.rs'
      - 'tests/src/managed_workspace_ownership.rs'

permissions:
  contents: read

concurrency:
  group: workspace-recovery-resolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Recovery source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain exact hosted formatting patch
        run: |
          git rev-parse HEAD > recovery-format-source.txt
          cargo fmt --all
          git diff --binary > recovery-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-format-${{ github.run_id }}
          path: |
            recovery-format-source.txt
            recovery-format.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code
  qualification:
    needs: formatting
    name: Storage recovery and ownership (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Bind actual source
        shell: bash
        run: |
          git rev-parse HEAD > recovery-source.txt
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Strict storage recovery and rollback
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kernel --lib --locked storage::tests -- --nocapture --test-threads=1 2>&1 | tee recovery-storage.log
      - name: Actual shipped recovery and ownership commands
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-cli --test storage_commands --locked -- --nocapture --test-threads=1 2>&1 | tee recovery-cli.log
          cargo test -p agent-cli --test workspace_ownership_commands --locked -- --nocapture 2>&1 | tee recovery-maintenance.log
      - name: Cross-process namespace crash and preservation
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p integration-tests --lib --features workspace-qualification --locked managed_workspace_ownership -- --nocapture --test-threads=1 2>&1 | tee recovery-namespace.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-recovery-${{ runner.os }}-${{ github.run_id }}
          path: |
            recovery-source.txt
            recovery-storage.log
            recovery-cli.log
            recovery-maintenance.log
            recovery-namespace.log
          if-no-files-found: error
          retention-days: 30
