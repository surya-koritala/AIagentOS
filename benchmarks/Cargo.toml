[package]
name = "os-benchmark"
version = "0.3.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "os-benchmark"
path = "os_benchmark.rs"

[[bin]]
name = "stress-test"
path = "stress_test.rs"

[[bin]]
name = "os-demo"
path = "os_demo.rs"

[[bin]]
name = "agent-bench"
path = "agent_bench.rs"

[[bin]]
name = "governance-demo"
path = "src/bin/governance-demo.rs"

[[bin]]
name = "memory-qualification"
path = "src/bin/memory-qualification.rs"

[dependencies]
kernel = { path = "../crates/kernel", version = "=0.3.0" }
adapters = { path = "../crates/adapters", version = "=0.3.0" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
