name: Extended security tests

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The repository pins stable Rust for normal builds. Security instrumentation
  # must explicitly override that repository-level toolchain selection.
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

concurrency:
  group: extended-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-fault-matrix:
    name: Exact-commit deterministic fault matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep the release fixture on the repository's supported stable
      # toolchain even though the instrumentation jobs below require nightly.
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Validate fault fixture contract
        run: >-
          cargo run --release --locked --package os-benchmark
          --bin resilience-qualification -- --validate
      - name: Exercise every deterministic fault and recovery path
        run: |
          mkdir -p target/qualification
          cargo run --release --locked --package os-benchmark \
            --bin resilience-qualification -- \
            --all --output target/qualification/deterministic-fault-matrix.json
      - name: Verify exact-source fault evidence
        run: |
          report=target/qualification/deterministic-fault-matrix.json
          test "$(jq -r .schema_version "$report")" = "1"
          test "$(jq -r .qualification_class "$report")" = "deterministic_resilience_fixture"
          test "$(jq -r .passed "$report")" = "true"
          test "$(jq -r .production_claim_allowed "$report")" = "false"
          test "$(jq -r .build_profile "$report")" = "release"
          test "$(jq -r .smoke_scaled "$report")" = "false"
          test "$(jq -r .source.commit "$report")" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty "$report")" = "false"
          jq -e '
            [.scenarios[].name] == [
              "turn-overload",
              "slow-clients",
              "provider-outage",
              "cancellation-storm",
              "disk-full",
              "database-lock",
              "network-partition"
            ]
            and all(.scenarios[]; .passed == true)
            and all(.scenarios[].checks[]; . == true)
            and (
              .scenarios[]
              | select(.name == "turn-overload")
              | .checks.provider_backpressure_peak_rss_bounded == true
                and .checks.provider_backpressure_steady_rss_bounded == true
                and .observed.memory_waves >= 4
                and .observed.rss_samples >= 5
            )
            and (
              .scenarios[]
              | select(.name == "slow-clients")
              | .checks.slow_client_peak_rss_bounded == true
                and .checks.slow_client_steady_rss_bounded == true
                and .observed.memory_waves >= 4
                and .observed.rss_samples >= 5
            )
          ' "$report"
      - name: Retain deterministic fault qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-fault-matrix-${{ github.sha }}
          path: target/qualification/deterministic-fault-matrix.json
          if-no-files-found: error
          retention-days: 90

  rootless-container-sandbox:
    name: Rootless container sandbox breakout and cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.6.2
          rootless: true
          daemon-config: |
            {
              "exec-opts": ["native.cgroupdriver=cgroupfs"]
            }
      - name: Verify rootless daemon and pull immutable qualification image
        env:
          QUALIFICATION_IMAGE: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
        run: |
          docker info --format '{{json .SecurityOptions}}' | grep -qi rootless
          docker pull "${QUALIFICATION_IMAGE}"
          echo "AGENTOS_SANDBOX_TEST_IMAGE=${QUALIFICATION_IMAGE}" >> "$GITHUB_ENV"
      - name: Exercise live breakout, cancellation, and crash cleanup
        env:
          # Rust test processes run from the package directory, so use an
          # absolute workspace path that the following workflow steps share.
          AGENTOS_SANDBOX_EVIDENCE_PATH: ${{ github.workspace }}/target/qualification/rootless-sandbox-crash.json
        run: |
          mkdir -p target/qualification
          cargo test -p kernel \
            docker_sandbox::tests::live_rootless_container_blocks_escape_and_cleans_cancellation_and_crash \
            --locked -- --ignored --exact --nocapture
      - name: Verify exact-source sandbox evidence
        run: |
          test "$(jq -r .passed target/qualification/rootless-sandbox-crash.json)" = "true"
          test "$(jq -r .production_claim_allowed target/qualification/rootless-sandbox-crash.json)" = "false"
          test "$(jq -r .qualification_class target/qualification/rootless-sandbox-crash.json)" = "live_rootless_linux_sandbox"
          test "$(jq -r .source.commit target/qualification/rootless-sandbox-crash.json)" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty target/qualification/rootless-sandbox-crash.json)" = "false"
          test "$(jq -r .environment.image target/qualification/rootless-sandbox-crash.json)" = "$AGENTOS_SANDBOX_TEST_IMAGE"
          test "$(jq '[.checks[] | select(. == true)] | length' target/qualification/rootless-sandbox-crash.json)" = "9"
      - name: Retain rootless sandbox qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootless-sandbox-crash-${{ github.sha }}
          path: target/qualification/rootless-sandbox-crash.json
          if-no-files-found: error
          retention-days: 90

  miri:
    name: Miri (unsafe/concurrency smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: miri
      - run: cargo miri setup
      - name: Exercise in-memory policy and isolation code under Miri
        env:
          # These audit tests read wall-clock time; Miri still checks memory
          # safety and concurrency while allowing that deterministic host call.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri test -p kernel cgroups::tests
          cargo miri test -p kernel permissions::tests

  address-sanitizer:
    name: Address sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
      - name: Run deterministic security-critical tests under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo test -p kernel --target x86_64-unknown-linux-gnu cgroups::tests -- --test-threads=1
          cargo test -p kernel --target x86_64-unknown-linux-gnu permissions::tests -- --test-threads=1
          cargo test -p kernel --target x86_64-unknown-linux-gnu auth::tests -- --test-threads=1
          cargo test -p kernel --target x86_64-unknown-linux-gnu syscall_gate::tests -- --test-threads=1

  fuzz:
    name: Wire-protocol fuzz smoke
    runs-on: ubuntu-latest
    # A cold hosted runner can spend more than 11 minutes compiling both
    # libFuzzer targets; retain enough time for both bounded 120-second runs
    # and evidence publication.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build every fuzz target
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Exercise untrusted wire input
        run: cargo fuzz run wire_syscall --target x86_64-unknown-linux-gnu -- -max_total_time=120 -max_len=65536
      - name: Exercise partial and out-of-order transport fragments
        run: cargo fuzz run wire_transport --target x86_64-unknown-linux-gnu -- -max_total_time=120 -max_len=262144
      - name: Preserve newly discovered corpus and crash evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wire-fuzz-evidence
          path: |
            fuzz/corpus/wire_syscall
            fuzz/artifacts/wire_syscall
            fuzz/corpus/wire_transport
            fuzz/artifacts/wire_transport
          if-no-files-found: warn
