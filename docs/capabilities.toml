, queues, permits, and connections with explicit post-warmup thresholds; its smoke artifact is regression evidence only, and the target exact-release run has not yet occurred. A strict release-SLO evaluator recalculates all nine targets from raw bounded observations, requires sufficient windows/volumes plus exact-commit soak and incident evidence, rejects fixture/dirty/mixed-source input, and retains only a bounded report and source hashes. Its protected exact-tag workflow is implemented, but no exact release candidate has supplied an eligible target report. Fixture artifacts bind exact source/configuration and explicitly forbid production claims. Protocol negotiation and malformed frames rejected before dispatch are not separate request series, internal model-selected tool calls do not yet have a distinct success family, JSON logs are the supported trace export rather than an OpenTelemetry backend, and external provider spans are not propagated. Target-deployment performance runs, the actual 24-hour resource/leak artifact, target TLS/proxy/provider fault runs, external Alertmanager delivery, privacy disable/export verification, a human incident game day, an eligible exact-RC report, and independent review remain open in #125; this capability is not production-qualified."]

