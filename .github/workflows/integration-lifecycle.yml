name: Combined server and coding lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-lifecycle.yml'
      - 'crates/kernel/src/syscall_server.rs'
      - 'crates/coding-agent/**'

permissions:
  contents: read

concurrency:
  group: combined-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Owned server and coding lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Actual server handler reclamation
        run: cargo test -p kernel stopping_the_listener_reclaims_live_connections_and_the_store --locked
      - name: Real coding restart, cancellation and governance fixtures
        run: cargo test -p coding-agent --locked
