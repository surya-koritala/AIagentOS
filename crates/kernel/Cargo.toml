[package]
name = "kernel"
version = "0.4.0-rc.1"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[features]
fuzzing = []
# Experimental WASM module system (src/modules.rs). Off by default: it has no
# production caller and pulls in 78 crates, including all of Cranelift.
# See docs/SECONDARY_CAPABILITIES.md.
wasm = ["dep:wasmtime"]
qualification = []

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
wasmtime = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["io"] }
rusqlite = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
futures-core = "0.3"
libc = "0.2"
tokio-rustls = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
cap-std = { workspace = true }
cap-primitives = { workspace = true }
semver = { workspace = true }
openraft = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { workspace = true }
wiremock = { workspace = true }
tempfile = "3"
