<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent OS governed execution architecture</title>
  <desc id="desc">All agent entry points use one validated tool registry authorization path, pass through namespace, capability, MAC, approval, and quota checks, then reach the sandboxed resource broker and providers. Audit, scheduling, context, and persistence remain kernel-owned services.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c3349"/>
      <stop offset="1" stop-color="#28204b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#55d9ff"/>
    </marker>
    <style>
      .title { font: 700 34px ui-sans-serif, system-ui, sans-serif; fill: #f2f7ff; }
      .subtitle { font: 400 18px ui-sans-serif, system-ui, sans-serif; fill: #9db0c8; }
      .section { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #dce9f8; letter-spacing: .5px; }
      .box-title { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #eef7ff; }
      .box-copy { font: 400 15px ui-sans-serif, system-ui, sans-serif; fill: #aebed2; }
      .step { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #eaf8ff; }
      .tiny { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #7f95af; letter-spacing: .6px; }
      .panel { fill: #101d31; stroke: #29415e; stroke-width: 2; }
      .chip { fill: #14263d; stroke: #31516f; stroke-width: 1.5; }
      .flow { fill: none; stroke: #55d9ff; stroke-width: 4; marker-end: url(#arrow); }
      .support { fill: none; stroke: #8d79ff; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="920" rx="28" fill="url(#background)"/>
  <path d="M0 145 H1600 M0 775 H1600" stroke="#14253d" stroke-width="1"/>

  <text x="70" y="66" class="title">One governed path for every agent action</text>
  <text x="70" y="101" class="subtitle">Declarations are validated before publication; authorization happens before provider execution.</text>
  <rect x="1180" y="43" width="350" height="50" rx="25" fill="#102c35" stroke="#2bcf99" stroke-width="2"/>
  <circle cx="1211" cy="68" r="8" fill="#2bcf99" filter="url(#glow)"/>
  <text x="1232" y="74" class="box-copy" fill="#aef8dc">FAIL CLOSED BY DEFAULT</text>

  <text x="70" y="180" class="section">ENTRY POINTS</text>
  <g>
    <rect x="70" y="205" width="250" height="88" rx="14" class="panel"/>
    <text x="94" y="242" class="box-title">AgentExecutor</text>
    <text x="94" y="268" class="box-copy">think → act → observe</text>

    <rect x="350" y="205" width="250" height="88" rx="14" class="panel"/>
    <text x="374" y="242" class="box-title">JSON syscalls</text>
    <text x="374" y="268" class="box-copy">TCP · Unix · TLS</text>

    <rect x="630" y="205" width="250" height="88" rx="14" class="panel"/>
    <text x="654" y="242" class="box-title">Rust SDK</text>
    <text x="654" y="268" class="box-copy">typed remote client</text>

    <rect x="910" y="205" width="250" height="88" rx="14" class="panel"/>
    <text x="934" y="242" class="box-title">MCP server</text>
    <text x="934" y="268" class="box-copy">tools/list · tools/call</text>

    <rect x="1190" y="205" width="340" height="88" rx="14" class="panel"/>
    <text x="1214" y="242" class="box-title">CLI · TUI · operator API</text>
    <text x="1214" y="268" class="box-copy">authenticated control surfaces</text>
  </g>

  <path d="M195 293 V330 H800" class="flow"/>
  <path d="M475 293 V330 H800" class="flow"/>
  <path d="M755 293 V330 H800" class="flow"/>
  <path d="M1035 293 V330 H800" class="flow"/>
  <path d="M1360 293 V330 H800" class="flow"/>

  <rect x="390" y="330" width="820" height="94" rx="18" fill="#10293d" stroke="#42c7ef" stroke-width="2.5" filter="url(#glow)"/>
  <text x="800" y="366" text-anchor="middle" class="box-title">ToolRegistry::authorize_call</text>
  <text x="800" y="395" text-anchor="middle" class="box-copy">validated action · typed resource extraction · one token estimate · unknown tools denied</text>

  <path d="M800 424 V462" class="flow"/>

  <rect x="70" y="462" width="1460" height="176" rx="22" fill="url(#gate)" stroke="#6ddfff" stroke-width="3"/>
  <text x="100" y="500" class="section">SYSCALL GATE</text>
  <text x="100" y="527" class="tiny">FIRST FAILURE WINS</text>

  <g>
    <rect x="290" y="493" width="215" height="105" rx="14" class="chip"/>
    <text x="314" y="529" class="step">0 · namespace</text>
    <text x="314" y="556" class="box-copy">tool visibility</text>
    <text x="314" y="579" class="box-copy">tenant isolation</text>

    <rect x="525" y="493" width="215" height="105" rx="14" class="chip"/>
    <text x="549" y="529" class="step">1 · capabilities</text>
    <text x="549" y="556" class="box-copy">every declared bit</text>
    <text x="549" y="579" class="box-copy">unknown bits rejected</text>

    <rect x="760" y="493" width="190" height="105" rx="14" class="chip"/>
    <text x="784" y="529" class="step">2 · MAC</text>
    <text x="784" y="556" class="box-copy">subject · action</text>
    <text x="784" y="579" class="box-copy">resource policy</text>

    <rect x="970" y="493" width="215" height="105" rx="14" class="chip"/>
    <text x="994" y="529" class="step">3 · approval</text>
    <text x="994" y="556" class="box-copy">exact contract</text>
    <text x="994" y="579" class="box-copy">atomic one-shot</text>

    <rect x="1205" y="493" width="215" height="105" rx="14" class="chip"/>
    <text x="1229" y="529" class="step">4 · quotas</text>
    <text x="1229" y="556" class="box-copy">hierarchical tokens</text>
    <text x="1229" y="579" class="box-copy">concurrency slots</text>
  </g>

  <path d="M800 638 V675" class="flow"/>

  <rect x="225" y="675" width="1150" height="88" rx="18" class="panel"/>
  <text x="260" y="710" class="box-title">ResourceBroker</text>
  <text x="260" y="739" class="box-copy">permission profile · unforgeable sandbox identity · canonical resource boundary · provider admission</text>

  <path d="M800 763 V801" class="flow"/>
  <g>
    <rect x="240" y="801" width="250" height="76" rx="14" class="chip"/>
    <text x="365" y="834" text-anchor="middle" class="box-title">filesystem</text>
    <text x="365" y="858" text-anchor="middle" class="box-copy">workspace-bound paths</text>
    <rect x="530" y="801" width="250" height="76" rx="14" class="chip"/>
    <text x="655" y="834" text-anchor="middle" class="box-title">network</text>
    <text x="655" y="858" text-anchor="middle" class="box-copy">host policy + quotas</text>
    <rect x="820" y="801" width="250" height="76" rx="14" class="chip"/>
    <text x="945" y="834" text-anchor="middle" class="box-title">application</text>
    <text x="945" y="858" text-anchor="middle" class="box-copy">sandboxed execution</text>
    <rect x="1110" y="801" width="250" height="76" rx="14" class="chip"/>
    <text x="1235" y="834" text-anchor="middle" class="box-title">IPC</text>
    <text x="1235" y="858" text-anchor="middle" class="box-copy">brokered messages</text>
  </g>

  <path d="M110 638 V720 H225" class="support"/>
  <text x="85" y="681" class="tiny">AUDIT + METRICS</text>
  <path d="M1490 638 V720 H1375" class="support"/>
  <text x="1378" y="681" class="tiny">SCHEDULER + CONTEXT</text>
</svg>
