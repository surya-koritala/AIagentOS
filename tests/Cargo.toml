[package]
name = "integration-tests"
version = "0.3.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[lib]
name = "integration_tests"
path = "src/lib.rs"

[dependencies]
kernel = { path = "../crates/kernel", version = "=0.3.0" }
agent-sdk = { path = "../crates/sdk", version = "=0.3.0" }
adapters = { path = "../crates/adapters", version = "=0.3.0" }
resources = { path = "../crates/resources", version = "=0.3.0" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
agent-cli = { path = "../crates/cli", version = "=0.3.0" }
agent-tui = { path = "../crates/tui", version = "=0.3.0" }
tauri-app = { path = "../crates/tauri-app", version = "=0.3.0", default-features = false }
proptest = { workspace = true }
wiremock = { workspace = true }
futures = "0.3"
rusqlite = { workspace = true }
