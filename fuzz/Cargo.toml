[package]
name = "agentos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
kernel = { path = "../crates/kernel", version = "=0.3.0", features = ["fuzzing"] }

[[bin]]
name = "wire_syscall"
path = "fuzz_targets/wire_syscall.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_transport"
path = "fuzz_targets/wire_transport.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
