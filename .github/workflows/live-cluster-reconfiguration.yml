name: Live cluster reconfiguration preflight

on:
  push:
    branches: [codex/live-cluster-reconfiguration]
    paths:
      - 'crates/kernel/src/cluster*.rs'
      - 'crates/kernel/src/lib.rs'
      - '.github/workflows/live-cluster-reconfiguration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cluster-preflight-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain source and formatter patch
        run: |
          git rev-parse HEAD > live-cluster-source.txt
          cargo fmt --all
          git diff --binary > live-cluster-rustfmt.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-cluster-format-${{ github.run_id }}
          path: |
            live-cluster-source.txt
            live-cluster-rustfmt.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code

  compile:
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Compile all kernel targets before native qualification
        timeout-minutes: 15
        run: cargo check -p kernel --all-targets --locked
