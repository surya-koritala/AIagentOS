contract_version = 1
prometheus_format = "0.0.4"
compatibility = "Metric names, types, units, label keys, and enumerated label values do not change within contract v1. Additive families require a reviewed contract update."
forbidden_label_classes = ["agent_id", "request_id", "correlation_id", "tenant_id", "user_id", "credential_id", "prompt", "content", "path", "url", "tool", "provider"]

[[metric]]
name = "agentos_telemetry_contract_info"
type = "gauge"
unit = "dimensionless"
labels = ["version"]
allowed_label_values = { version = ["1"] }

[[metric]]
name = "agentos_requests_in_flight"
type = "gauge"
unit = "requests"
labels = []

[[metric]]
name = "agentos_requests_total"
type = "counter"
unit = "requests"
labels = ["subsystem", "outcome"]
allowed_label_values = { subsystem = ["agent", "auth", "checkpoint", "cluster", "memory", "operator", "package", "protocol", "service", "storage", "system", "tool"], outcome = ["success", "rejected", "failed", "timed_out", "cancelled"] }

[[metric]]
name = "agentos_request_duration_seconds"
type = "histogram"
unit = "seconds"
labels = ["subsystem", "outcome", "le"]
allowed_label_values = { subsystem = ["agent", "auth", "checkpoint", "cluster", "memory", "operator", "package", "protocol", "service", "storage", "system", "tool"], outcome = ["success", "rejected", "failed", "timed_out", "cancelled"], le = ["0.005", "0.010", "0.025", "0.050", "0.100", "0.250", "0.500", "1.000", "2.500", "5.000", "10.000", "30.000", "60.000", "+Inf"] }

[[metric]]
name = "agentos_syscall_gate_total"
type = "counter"
unit = "decisions"
labels = ["result"]
allowed_label_values = { result = ["allowed", "denied_capability", "denied_mac", "denied_approval", "denied_cgroup", "denied_namespace", "denied_unknown"] }

[[metric]]
name = "agentos_syscall_gate_audited_total"
type = "counter"
unit = "decisions"
labels = []

[[metric]]
name = "agentos_agents"
type = "gauge"
unit = "agents"
labels = []

[[metric]]
name = "agentos_running_agents"
type = "gauge"
unit = "agents"
labels = []

[[metric]]
name = "agentos_live_agents"
type = "gauge"
unit = "agents"
labels = []

[[metric]]
name = "agentos_queued_agents"
type = "gauge"
unit = "agents"
labels = []

[[metric]]
name = "agentos_paused_agents"
type = "gauge"
unit = "agents"
labels = []

[[metric]]
name = "agentos_stopped_agents"
type = "gauge"
unit = "agents"
labels = []

[[metric]]
name = "agentos_services"
type = "gauge"
unit = "services"
labels = ["state"]
allowed_label_values = { state = ["configured", "desired", "running", "ready", "healthy", "failed"] }

[[metric]]
name = "agentos_service_restarts_total"
type = "counter"
unit = "attempts"
labels = []

[[metric]]
name = "agentos_service_dependency_blocks_total"
type = "counter"
unit = "blocks"
labels = []

[[metric]]
name = "agentos_turn_admission"
type = "gauge"
unit = "turns"
labels = ["state"]
allowed_label_values = { state = ["active", "waiting", "capacity"] }

[[metric]]
name = "agentos_turn_admitted_total"
type = "counter"
unit = "turns"
labels = []

[[metric]]
name = "agentos_turn_class_admitted_total"
type = "counter"
unit = "turns"
labels = ["class"]
allowed_label_values = { class = ["realtime", "normal", "background", "deadline"] }

[[metric]]
name = "agentos_turn_cancelled_total"
type = "counter"
unit = "turns"
labels = []

[[metric]]
name = "agentos_turn_cooperative_yields_total"
type = "counter"
unit = "turns"
labels = []

[[metric]]
name = "agentos_turn_starvation_total"
