name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Blocking Rust quality and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Prove pinned workflow actions exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_workflow_action_pins.py --remote
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --exclude tauri-app --all-targets -- -D warnings
      - name: Capability and public-claim contract
        run: cargo test -p integration-tests capability_registry --locked
      - name: Critical coverage verifier regressions
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Prometheus alert syntax, firing, hold, and recovery regressions
        run: scripts/run_promtool_tests.sh
      - name: Below-production retained capabilities have open qualification work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -F ' = ' '
            function clean(value) { gsub(/"/, "", value); return value }
            function emit() {
              if (seen && maturity != "production-qualified" && disposition != "excluded-from-v1") {
                if (qualification != "") print qualification
                else print tracking
              }
            }
            /^\[\[capability\]\]/ {
              emit()
              seen=1
              maturity=""
              tracking=""
              qualification=""
              disposition="retained"
              next
            }
            /^maturity = / { maturity=clean($2) }
            /^tracking_issue = / { tracking=$2 }
            /^qualification_issue = / { qualification=$2 }
            /^v1_disposition = / { disposition=clean($2) }
            END { emit() }
          ' docs/capabilities.toml | while read -r issue; do
            test "$(gh issue view "$issue" --json state --jq .state)" = "OPEN"
          done
      - name: Documentation tests
        run: cargo test --workspace --exclude tauri-app --doc --locked
      - name: Rustdoc warnings are errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --exclude tauri-app --no-deps --locked
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7
        with:
          tool: mdbook@0.4.52
      - name: Documentation book builds
        run: mdbook build docs
      - name: All-feature compilation
        run: cargo build --workspace --exclude tauri-app --all-features --locked

  rust-platforms:
    name: Rust tests (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Deterministic unit and integration tests
        run: cargo test --workspace --exclude tauri-app --locked

  desktop-platforms:
    name: Desktop Rust warnings (${{ matrix.os }})
    needs: [quality, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tauri-ui-dist
          path: crates/tauri-app/ui/dist
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Tauri command and backend warnings are errors
        run: cargo clippy -p tauri-app --all-targets --locked -- -D warnings

  frontend:
    name: Frontend build and vulnerability gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tauri-app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: crates/tauri-app/ui/package-lock.json
      - name: Locked dependency install
        run: npm ci
      - name: Reject high or critical advisories
        run: npm audit --audit-level=high
      - name: Svelte types and accessibility warnings are errors
        run: npm run check
      - name: Production frontend build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-ui-dist
          path: crates/tauri-app/ui/dist
          if-no-files-found: error

  rust-supply-chain:
    name: Rust advisory, license, and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          command-arguments: advisories bans licenses sources

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Enforce workspace line coverage floor
        run: >-
          cargo llvm-cov --workspace --exclude tauri-app --all-targets --locked
          --lcov --output-path lcov.info --fail-under-lines 60 -- --test-threads=1
      - name: Enforce release-critical subsystem floors
        run: python scripts/check_critical_coverage.py lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov
          path: lcov.info

  memory-qualification:
    name: Memory recall and scale qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Compare ANN retrieval with exact cosine search
        run: >-
          cargo run -p os-benchmark --bin memory-qualification --locked
          > memory-qualification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-qualification
          path: memory-qualification.json
          if-no-files-found: error

  container-smoke:
    name: Container startup, health, persistence, backups, and non-root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull -t agentos:ci .
      - name: Verify configured non-root identity
        run: test "$(docker image inspect agentos:ci --format '{{.Config.User}}')" = "agentos"
      - name: Boot and verify syscall health
        run: |
          docker volume create agentos-ci-data
          docker volume create agentos-ci-backups
          docker run -d --name agentos-ci -p 127.0.0.1:7777:7777 \
            -e AGENT_SERVER_ALLOW_INSECURE_REMOTE=1 \
            -e AGENTOS_BACKUP_ENABLED=true \
            -e AGENTOS_BACKUP_RUN_ON_START=true \
            -v agentos-ci-data:/data \
            -v agentos-ci-backups:/backups \
            agentos:ci agent-server 0.0.0.0:7777
          for i in $(seq 1 30); do
            if printf '{"op":"node_info"}\n' | nc -w2 127.0.0.1 7777 | grep -q '"status":"node_info"'; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "${healthy:-0}" = "1"
          test "$(docker exec agentos-ci id -u)" = "10001"
      - name: Verify scheduled backup publication and operator status
        run: |
          for i in $(seq 1 30); do
            backup_reply="$(printf '{"op":"storage_backup_status"}\n' | nc -w2 127.0.0.1 7777 || true)"
            if jq -e '
              .status == "storage_backup_status"
              and .maintenance.enabled == true
              and .maintenance.successes_total >= 1
              and .maintenance.failures_total == 0
              and (.maintenance.last_backup_name | startswith("scheduled_"))
            ' <<< "$backup_reply" >/dev/null 2>&1; then
              backup_ready=1
              break
            fi
            sleep 1
          done
          test "${backup_ready:-0}" = "1"
          test "$(docker exec agentos-ci sh -c \
            'find /backups -mindepth 2 -maxdepth 2 -type f -name manifest.json | wc -l')" -ge 1
      - name: Verify persistent data survives restart
        run: |
          create_reply="$(printf '{"op":"create_agent","name":"persistence","task":"ci","provider":"stub","profile":"standard","priority":3}\n' | nc -w5 127.0.0.1 7777)"
          agent_id="$(jq -er 'select(.status == "agent_created") | .id' <<< "$create_reply")"
          put_reply="$(printf '{"op":"storage_put","agent_id":"%s","key":"ci-proof","value":"survived"}\n' "$agent_id" | nc -w5 127.0.0.1 7777)"
          test "$(jq -r .status <<< "$put_reply")" = "storage_ok"
          printf '%s' "$agent_id" > /tmp/agentos-ci-agent-id
          docker restart agentos-ci
          for i in $(seq 1 30); do
            if printf '{"op":"node_info"}\n' | nc -w2 127.0.0.1 7777 | grep -q '"status":"node_info"'; then
              healthy_after_restart=1
              break
            fi
            sleep 1
          done
          test "${healthy_after_restart:-0}" = "1"
          agent_id="$(cat /tmp/agentos-ci-agent-id)"
          get_reply="$(printf '{"op":"storage_get","agent_id":"%s","key":"ci-proof"}\n' "$agent_id" | nc -w5 127.0.0.1 7777)"
          test "$(jq -r .status <<< "$get_reply")" = "storage_value"
          test "$(jq -r .value <<< "$get_reply")" = "survived"
          for i in $(seq 1 30); do
            backup_count="$(docker exec agentos-ci sh -c \
              'find /backups -mindepth 2 -maxdepth 2 -type f -name manifest.json | wc -l')"
            if test "$backup_count" -ge 2; then
              restarted_backup_ready=1
              break
            fi
            sleep 1
          done
          test "${restarted_backup_ready:-0}" = "1"
      - name: Diagnostics
        if: always()
        run: |
          docker logs agentos-ci || true
          docker rm -f agentos-ci || true
          docker volume rm agentos-ci-data || true
          docker volume rm agentos-ci-backups || true

  required:
    name: Required release gates
    if: always()
    needs:
      - quality
      - rust-platforms
      - desktop-platforms
      - frontend
      - rust-supply-chain
      - coverage
      - memory-qualification
      - container-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Reject any failed or skipped gate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          test "$(jq -r '[.[] | .result == "success"] | all' <<< "$NEEDS_JSON")" = "true"
