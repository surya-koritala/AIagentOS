limitations = ["The checked-in provider matrix gives every implementation and operation an explicit status and a CI-validated platform contract. Generic resource-provider operations run in kernel-owned tasks: broker cancellation signals a provider token, waits five seconds for drain, then aborts; the admission permit remains task-owned until completion. Async panics and panicking provider metadata are converted to redacted errors, and runtime registration refuses replacement of an existing resource class. Empty or compatibility providers are omitted from discovery and fail with typed unsupported errors. All brokered calls have bounded operation names, JSON request/response depth, node count, individual and aggregate string data, error diagnostics, queue length, per-resource concurrency, admission wait, and execution time; provider-specific lower limits remain authoritative. This is an enforceable future-ownership and capability-honesty contract, not evidence that an unaudited third-party provider never detaches work before returning; only reviewed implementations can be promoted. Every agent filesystem path, including explicitly trusted mode, now uses the retained workspace directory capability with atomic create/replace, permission, UTF-8, path/content/list, final-symlink, special-file, quota, and ancestor-swap controls; the internal metadata provider cannot perform ambient I/O, and the standalone resources compatibility provider advertises no operations and returns typed unsupported errors. Blocking capability workers own their admission permits until real completion, receive broker cancellation, check it before irreversible mutations and during scans, and remain reaper-owned if a host syscall outlives the bounded foreground drain. A host filesystem syscall cannot be forcibly killed and may retain one permit until it returns. Agent HTTP uses a strict operation schema, 4 KiB URL, 1 MiB/64-level/65,536-node JSON request, 4 MiB strict-UTF-8 response, no proxy, no redirect, and no caller header/credential/cookie/file-transfer/WebSocket channels; controlled exact-commit Linux evidence exercises an ambient proxy, public route, redirect, private sentinel, and mid-request DNS rebinding. The standalone network provider fails closed. Agent application launch accepts only bounded literal command/args and dispatches only through the Linux rootless digest-pinned container backend with fixed cwd, no caller environment/stdin, no implicit shell, a 30-second timeout, strict-UTF-8 output bounds, and exact-container process-tree cleanup; kernel and standalone providers cannot launch ambient host processes. Application execution is explicitly Linux-container-only. Feature-gated HTML and Chromium automation helpers are explicitly trusted-process-only: they have no kernel registration or agent identity, but now enforce strict HTTPS, no ambient proxy or redirects, bounded strict-UTF-8 fetches and projections, unique private Chromium profiles, CDP download denial, fixed deadlines, redacted errors and URL projections, bounded in-memory screenshots, and explicit process/profile cleanup. Unit tests and an opt-in disposable real-Chromium fixture retain that helper contract without promoting it. Every future peripheral tool binding must require sandbox execution and explicit local human approval; the trusted in-process UI can grant, inspect through a non-secret opaque-target projection, and revoke one exact single-use approval, while agent teardown purges pending grants and no remote surface can create them. Device implementations and active-use indicators remain unavailable. Browser, peripheral, computer-use, stateful application control, and standalone compatibility providers are unavailable on every platform and excluded from the v1 support promise rather than called production-qualified. Live deployment-filesystem evidence, the remaining live provider security matrix, supported-platform Chromium evidence, agent browser egress/authorization isolation, and independent review remain open in #124/#127; this capability is not production-qualified."]

