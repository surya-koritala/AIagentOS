name: Cluster operator CLI conformance

on:
  push:
    branches: [codex/cluster-cli-operations]
    paths:
      - 'crates/sdk/src/**'
      - 'crates/sdk/tests/cluster_admission.rs'
      - 'crates/cli/src/**'
      - 'crates/cli/tests/cluster_commands.rs'
      - '.github/workflows/cluster-cli.yml'
  pull_request:
    paths:
      - 'crates/sdk/src/cluster.rs'
      - 'crates/sdk/tests/cluster_admission.rs'
      - 'crates/cli/src/cluster.rs'
      - 'crates/cli/tests/cluster_commands.rs'
      - '.github/workflows/cluster-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-cli-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Cluster operator source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain the actual formatter patch
        run: |
          git rev-parse HEAD > cluster-source.txt
          cargo fmt --all
          git diff --binary > cluster-rustfmt.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cluster-cli-format-${{ github.run_id }}
          path: |
            cluster-source.txt
            cluster-rustfmt.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code

  admission:
    name: Public challenged admission (${{ matrix.os }})
    needs: formatting
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Public admission and unchanged SDK contracts
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > cluster-source.txt
          cargo test -p agent-sdk --locked -- --nocapture 2>&1 | tee cluster-sdk.log
          cargo clippy -p agent-sdk --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cluster-cli-${{ runner.os }}-${{ github.run_id }}
          path: |
            cluster-source.txt
            cluster-sdk.log
          retention-days: 30
          if-no-files-found: error
