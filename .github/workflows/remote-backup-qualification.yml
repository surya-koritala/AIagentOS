name: Remote immutable backup qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 4"
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MINIO_SOURCE_COMMIT: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
  MC_SOURCE_COMMIT: 77f82e18b5401a65958f1619df6ebb994634bd88
  AWS_ACCESS_KEY_ID: agentosqualifier
  AWS_SECRET_ACCESS_KEY: agentosqualificationsecret
  AWS_REGION: us-east-1

concurrency:
  group: remote-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-object-lock-recovery:
    name: Exact-commit S3 object-lock publication and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Off the PR critical path; restore only, never consume cache budget.
          save-if: false
      - name: Validate the checked-in qualification contract
        run: >-
          cargo run --release --locked --package os-benchmark
          --bin remote-backup-qualification -- --validate
      - name: Build immutable disposable fixtures from pinned upstream sources
        id: minio-images
        run: |
          mkdir -p target/qualification
          for component in server client; do
            docker build \
              --file docker/qualification-minio.Dockerfile \
              --target "minio-${component}" \
              --build-arg "MINIO_SOURCE_COMMIT=$MINIO_SOURCE_COMMIT" \
              --build-arg "MC_SOURCE_COMMIT=$MC_SOURCE_COMMIT" \
              --tag "agentos-minio-${component}:qualification" .
            digest="$(docker image inspect --format '{{.Id}}' \
              "agentos-minio-${component}:qualification")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$component" "$digest" >> "$GITHUB_OUTPUT"
          done
          jq -n \
            --arg server_commit "$MINIO_SOURCE_COMMIT" \
            --arg client_commit "$MC_SOURCE_COMMIT" \
            --arg server_image "$(docker image inspect --format '{{.Id}}' agentos-minio-server:qualification)" \
            --arg client_image "$(docker image inspect --format '{{.Id}}' agentos-minio-client:qualification)" \
            '{server_source_commit: $server_commit, client_source_commit: $client_commit,
              server_image_digest: $server_image, client_image_digest: $client_image}' \
            > target/qualification/minio-fixture-build.json
      - name: Start an immutable disposable S3-compatible store
        env:
          MINIO_SERVER_IMAGE: ${{ steps.minio-images.outputs.server }}
          MINIO_CLIENT_IMAGE: ${{ steps.minio-images.outputs.client }}
        run: |
          docker volume create agentos-remote-backup-data
          docker run -d --name agentos-remote-backup \
            -p 127.0.0.1:9000:9000 \
            -e "MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID" \
            -e "MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY" \
            -v agentos-remote-backup-data:/data \
            "$MINIO_SERVER_IMAGE" server /data --address :9000
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-0}" = "1"
          docker run --rm --network host \
            -e "MC_HOST_target=http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@127.0.0.1:9000" \
            "$MINIO_CLIENT_IMAGE" mb --with-lock target/agentos-qualified-backups
      - name: Publish, hide current keys, and recover exact locked versions
        env:
          MINIO_SERVER_IMAGE: ${{ steps.minio-images.outputs.server }}
          MINIO_CLIENT_IMAGE: ${{ steps.minio-images.outputs.client }}
        run: |
          mkdir -p target/qualification
          cargo run --release --locked --package os-benchmark \
            --bin remote-backup-qualification -- \
            --mode disposable-minio \
            --endpoint http://127.0.0.1:9000 \
            --bucket agentos-qualified-backups \
            --prefix "${QUALIFICATION_SHA}/recovery-001" \
            --region "$AWS_REGION" \
            --state-dir target/qualification/remote-backup-state \
            --output target/qualification/remote-backup.json \
            --server-image-digest "$MINIO_SERVER_IMAGE" \
            --client-image-digest "$MINIO_CLIENT_IMAGE"
      - name: Verify exact-source retained evidence
        env:
          MINIO_SERVER_IMAGE: ${{ steps.minio-images.outputs.server }}
          MINIO_CLIENT_IMAGE: ${{ steps.minio-images.outputs.client }}
        run: |
          report=target/qualification/remote-backup.json
          test "$(jq -r .schema_version "$report")" = "1"
          test "$(jq -r .qualification_class "$report")" = "disposable_s3_object_lock_recovery"
          test "$(jq -r .environment.qualification_mode "$report")" = "disposable-minio"
          test "$(jq -r .proof_scope "$report")" = \
            "disposable_minio_s3_api_compliance_lock_and_exact_version_recovery"
          test "$(jq -r .passed "$report")" = "true"
          test "$(jq -r .production_claim_allowed "$report")" = "false"
          test "$(jq -r .target_remote_recovery_proof_eligible "$report")" = "false"
          test "$(jq -r .build_profile "$report")" = "release"
          test "$(jq -r .source.commit "$report")" = "$QUALIFICATION_SHA"
          test "$(jq -r .source.dirty "$report")" = "false"
          test "$(jq -r .environment.os "$report")" = "linux"
          test "$(jq -r .environment.architecture "$report")" = "x86_64"
          test "$(jq -r .environment.server_image_digest "$report")" = "$MINIO_SERVER_IMAGE"
          test "$(jq -r .environment.client_image_digest "$report")" = "$MINIO_CLIENT_IMAGE"
          test "$(jq '.publication.objects | length' "$report")" = "2"
          test "$(jq '.recovery.objects | length' "$report")" = "2"
          test "$(jq '.delete_marker_version_ids | length' "$report")" = "2"
          test "$(jq -r .public_recovery_fixture.trust_root.key_id "$report")" = \
            "$(jq -r .public_recovery_fixture.recovery_anchor.signing_key_id "$report")"
          jq -e '
            all(.checks[]; . == true)
            and all(.publication.objects[];
              .retention_mode == "COMPLIANCE"
              and (.version_id | length) > 0
              and .version_id != "null")
            and (.recovery.downloaded_bytes > 0)
            and (.recovery.recovery_point_age_seconds < 86400)
          ' "$report"
      - name: Retain bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-backup-${{ env.QUALIFICATION_SHA }}
          path: |
            target/qualification/remote-backup.json
            target/qualification/minio-fixture-build.json
          if-no-files-found: error
          retention-days: 90
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker logs agentos-remote-backup || true
          docker rm -f agentos-remote-backup || true
          docker volume rm agentos-remote-backup-data || true
