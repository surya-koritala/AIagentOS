name: Optional release asset contract

on:
  workflow_dispatch:
    inputs:
      negative_scenario:
        description: Expected failure probe; run in a scratch fork before release
        type: choice
        default: desktop-failed
        options: [desktop-failed, required-ci-failed, wedge-failed, release-artifacts-failed, container-failed]
  push:
    branches: [codex/optional-release-assets]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-assets.yml
      - .github/workflows/release-assets-scenario.yml
      - scripts/prepare_release_bundle.py
      - scripts/tests/test_prepare_release_bundle.py
      - scripts/tests/test_release_asset_workflow.py

permissions:
  contents: read

jobs:
  contract:
    name: Required inventory and optional updater regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise inventories, signed updater matrix, and workflow contract
        run: |
          python3 -m unittest discover -s scripts/tests -p test_prepare_release_bundle.py -v
          python3 -m unittest discover -s scripts/tests -p test_release_asset_workflow.py -v
          python3 -m unittest discover -s scripts/tests -p test_build_desktop_update_manifest.py -v
          python3 -m unittest discover -s scripts/tests -p test_verify_linux_cli_rc.py -v
          python3 scripts/verify_supported_platforms.py

  dependency-scenarios:
    name: Hosted dependency graph (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop-disabled, desktop-complete]
    uses: ./.github/workflows/release-assets-scenario.yml
    with:
      scenario: ${{ matrix.scenario }}

  expected-failure-scenario:
    name: Intentional negative dependency probe
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-assets-scenario.yml
    with:
      scenario: ${{ inputs.negative_scenario }}
