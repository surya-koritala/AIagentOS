name: Per-agent gate statistics evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'crates/kernel/src/syscall_server.rs'
      - 'crates/kernel/src/gate_statistics_tests.rs'
      - 'crates/kernel/src/syscall_gate.rs'
      - 'crates/kernel/src/tools.rs'
      - 'crates/kernel/src/sandbox.rs'
      - 'crates/kernel/src/wire_contract.rs'
      - 'crates/sdk/**'
      - 'crates/cli/**'
      - 'protocol/**'
      - '.github/workflows/agent-gate-statistics.yml'

permissions:
  contents: read

concurrency:
  group: agent-gate-statistics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  formatting:
    name: Gate statistics source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain exact source and formatting diagnostic
        run: |
          git rev-parse HEAD > gate-statistics-source.txt
          cargo fmt --all
          git diff --binary > gate-statistics-formatting.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gate-statistics-formatting-${{ github.run_id }}
          path: |
            gate-statistics-source.txt
            gate-statistics-formatting.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code

  counters:
    name: Gate counter wire, SDK and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Bind evidence to unmodified checked-out source
        shell: bash
        run: |
          git rev-parse HEAD > gate-statistics-source.txt
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Real denial classes, no lookup oracle, tenant boundaries and restart
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kernel gate_statistics_tests --locked -- --nocapture 2>&1 | tee gate-statistics-wire.log
          cargo test -p kernel wire_contract --locked 2>&1 | tee gate-statistics-contract.log
          cargo test -p integration-tests os_enforcement --locked 2>&1 | tee gate-statistics-enforcement.log
          cargo test -p kernel sandbox::tests::capability_directory_listing_is_deterministic_typed_and_bounded --locked -- --exact --nocapture 2>&1 | tee gate-statistics-lifetime.log
      - name: Actual SDK and shipped CLI preserve global bytes and scoped reads
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-sdk --test gate_statistics --locked -- --nocapture 2>&1 | tee gate-statistics-sdk.log
          cargo test -p agent-cli --test gate_statistics_commands --locked -- --nocapture 2>&1 | tee gate-statistics-cli.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gate-statistics-${{ runner.os }}-${{ github.run_id }}
          path: |
            gate-statistics-source.txt
            gate-statistics-*.log
          retention-days: 30
          if-no-files-found: error
