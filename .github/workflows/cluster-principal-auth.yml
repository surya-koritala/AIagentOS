name: Independent cluster principal proof

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Formatter preflight or focused protocol/quorum evidence
        required: true
        default: format
        type: choice
        options: [format, focused]
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/cluster-principal-auth.yml'
      - 'crates/kernel/src/cluster_*.rs'
      - 'crates/kernel/src/config.rs'
      - 'crates/kernel/src/schema.rs'
      - 'crates/kernel/src/syscall_server.rs'
      - 'crates/kernel/src/wire_contract.rs'
      - 'crates/sdk/**'
      - 'protocol/**'

permissions:
  contents: read

concurrency:
  group: principal-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Principal formatter preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain exact source and formatting repair
        run: |
          mkdir -p target/qualification/principal-format
          git rev-parse HEAD > target/qualification/principal-format/source-commit.txt
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            git diff --binary > target/qualification/principal-format/rustfmt.patch
          fi
          if ! rustfmt --edition 2021 --check crates/kernel/src/cluster_principal_tests.rs; then
            rustfmt --edition 2021 crates/kernel/src/cluster_principal_tests.rs
            git diff --binary > target/qualification/principal-format/rustfmt.patch
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: principal-format-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/qualification/principal-format
          retention-days: 30
      - name: Require formatted source before compilation
        run: test ! -s target/qualification/principal-format/rustfmt.patch
  focused:
    name: Principal protocol and quorum security
    needs: format
    if: github.event_name == 'pull_request' || inputs.stage == 'focused'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: cluster-principal-proof
      - name: Retain source identity
        run: |
          mkdir -p target/qualification/principal
          git rev-parse HEAD > target/qualification/principal/source-commit.txt
      - name: Independent proof, corrupted history and named compromise regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kernel principal --lib -- --nocapture 2>&1 | tee target/qualification/principal/principal.txt
          cargo test -p kernel cluster_consensus::tests --lib -- --nocapture 2>&1 | tee target/qualification/principal/consensus.txt
      - name: Actual three-node mTLS majority, forwarding, revocation and restart
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kernel cluster_runtime::tests --lib -- --test-threads=1 --nocapture 2>&1 | tee target/qualification/principal/runtime.txt
      - name: Public authorization, SDK and exact versioned wire fixtures
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kernel authorization_policy_classifies_every_syscall_and_agent_resource --lib 2>&1 | tee target/qualification/principal/authorization.txt
          cargo test -p kernel wire_contract --lib 2>&1 | tee target/qualification/principal/wire-rust.txt
          cargo test -p agent-sdk --test cluster_principal 2>&1 | tee target/qualification/principal/sdk.txt
          python3 -m unittest discover -s scripts/tests -p test_verify_wire_fixtures.py 2>&1 | tee target/qualification/principal/wire-python.txt
      - name: Capability inventory and existing streamed history contract
        shell: bash
        run: |
          set -o pipefail
          cargo test -p integration-tests capability_registry --lib 2>&1 | tee target/qualification/principal/capabilities.txt
          cargo test -p integration-tests gemini_history --lib 2>&1 | tee target/qualification/principal/gemini-history.txt
      - name: Actual shipped CLI independent signing and certificate replay
        shell: bash
        run: |
          set -o pipefail
          cargo test -p agent-cli principal --lib 2>&1 | tee target/qualification/principal/cli-principal.txt
          cargo test -p agent-cli --test cluster_commands -- --test-threads=1 2>&1 | tee target/qualification/principal/cli-commands.txt
          cargo test -p agent-cli --test cluster_server_lifecycle 2>&1 | tee target/qualification/principal/cli-daemon.txt
      - name: Warnings are errors
        run: cargo clippy -p kernel -p agent-sdk -p agent-cli --all-targets -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: principal-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/qualification/principal
          retention-days: 30
