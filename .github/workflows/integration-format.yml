name: Combined feature formatting evidence

on:
  workflow_dispatch:
    inputs:
      principal_compiler:
        description: Compile and lint principal source only; no tests or qualification
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-format.yml'
      - 'crates/**'
      - 'tests/**'
      - 'benchmarks/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Retained integration formatting check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain source and any formatter repair
        run: |
          mkdir -p target/qualification/format
          git rev-parse HEAD > target/qualification/format/source-commit.txt
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            git diff --binary > target/qualification/format/rustfmt.patch
          fi
          if test -f crates/kernel/src/cluster_principal_tests.rs && ! rustfmt --edition 2021 --check crates/kernel/src/cluster_principal_tests.rs; then
            rustfmt --edition 2021 crates/kernel/src/cluster_principal_tests.rs
            git diff --binary > target/qualification/format/rustfmt.patch
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-format-${{ github.sha }}
          path: target/qualification/format
          retention-days: 30
      - name: Require formatted source
        run: test ! -s target/qualification/format/rustfmt.patch
  principal-compiler:
    name: Principal compiler diagnostics only
    needs: formatting
    if: github.event_name == 'workflow_dispatch' && inputs.principal_compiler
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: cluster-principal-compiler
      - name: Retain compiler-only source identity
        run: |
          mkdir -p target/qualification/principal-compiler
          git rev-parse HEAD > target/qualification/principal-compiler/source-commit.txt
          printf '%s\n' 'Compiler diagnostics only. No tests, storage/schema acceptance, models, or production qualification.' > target/qualification/principal-compiler/scope.txt
      - name: Compile all owned targets and deny warnings
        shell: bash
        run: |
          set -o pipefail
          cargo check -p kernel -p agent-sdk --all-targets 2>&1 | tee target/qualification/principal-compiler/check.txt
          cargo clippy -p kernel -p agent-sdk --all-targets -- -D warnings 2>&1 | tee target/qualification/principal-compiler/clippy.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: principal-compiler-${{ github.sha }}
          path: target/qualification/principal-compiler
          retention-days: 30
