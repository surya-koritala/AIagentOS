name: Signed quorum capacity preflight

on:
  push:
    branches: [codex/signed-node-capacity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-capacity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain exact source and hosted formatter patch
        run: |
          git rev-parse HEAD > capacity-source.txt
          cargo fmt --all
          git diff --binary > capacity-rustfmt.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capacity-format-${{ github.run_id }}
          path: |
            capacity-source.txt
            capacity-rustfmt.patch
      - name: Require committed formatting
        run: git diff --exit-code

  compile:
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Compile all public consumers before native qualification
        run: cargo check -p kernel -p agent-sdk -p agent-cli -p agent-tui --all-targets --locked
      - name: Verify exact node-origin and freshness fences
        run: cargo test -p kernel --lib --locked cluster_capacity::tests -- --nocapture
      - name: Preserve public wire contracts
        run: cargo test -p kernel --lib --locked wire_contract::tests -- --nocapture
