[package]
name = "os-benchmark"
version = "0.3.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "os-benchmark"
path = "os_benchmark.rs"

[[bin]]
name = "stress-test"
path = "stress_test.rs"

[[bin]]
name = "os-demo"
path = "os_demo.rs"

[[bin]]
name = "agent-bench"
path = "agent_bench.rs"

[[bin]]
name = "governance-demo"
path = "src/bin/governance-demo.rs"

[[bin]]
name = "memory-qualification"
path = "src/bin/memory-qualification.rs"

[[bin]]
name = "capacity-qualification"
path = "src/bin/capacity-qualification.rs"

[[bin]]
name = "resilience-qualification"
path = "src/bin/resilience-qualification.rs"

[[bin]]
name = "soak-qualification"
path = "src/bin/soak-qualification.rs"

[dependencies]
kernel = { path = "../crates/kernel", version = "=0.3.0" }
adapters = { path = "../crates/adapters", version = "=0.3.0" }
agent-sdk = { path = "../crates/sdk", version = "=0.3.0" }
tokio = { version = "1", features = ["full"] }
tokio-util = { workspace = true }
uuid = { version = "1", features = ["v4"] }
async-trait = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
