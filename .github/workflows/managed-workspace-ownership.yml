name: Managed workspace store ownership

on:
  push:
    branches: [codex/managed-root-ownership]
    paths:
      - 'tests/src/managed_workspace_ownership.rs'
      - 'tests/src/lib.rs'
      - 'crates/cli/src/bin/agentctl.rs'
      - 'crates/cli/tests/workspace_ownership_commands.rs'
      - 'crates/kernel/src/**'
      - '.github/workflows/managed-workspace-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-workspace-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Managed workspace source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain the exact hosted formatting patch
        run: |
          git rev-parse HEAD > managed-store-format-source.txt
          cargo fmt --all
          git diff --binary > managed-store-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: managed-store-format-${{ github.run_id }}
          path: |
            managed-store-format-source.txt
            managed-store-format.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code
  processes:
    name: Two real processes and independent stores (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Actual cross-process cleanup and fresh authorized I/O
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > managed-store-source.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo test -p kernel --lib --locked managed_workspace -- --nocapture 2>&1 | tee managed-store-control.log
          cargo test -p integration-tests --lib --features kernel/qualification --locked managed_workspace_ownership -- --nocapture --test-threads=1 2>&1 | tee managed-store-processes.log
          cargo test -p agent-cli --test workspace_ownership_commands --locked -- --nocapture 2>&1 | tee managed-store-maintenance.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: managed-store-${{ runner.os }}-${{ github.run_id }}
          path: |
            managed-store-source.txt
            managed-store-processes.log
            managed-store-maintenance.log
            managed-store-control.log
          if-no-files-found: error
          retention-days: 30
