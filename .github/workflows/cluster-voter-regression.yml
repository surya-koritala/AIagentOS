name: Cluster voter transition regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/cluster-voter-regression.yml'
      - 'crates/kernel/src/cluster_runtime.rs'

permissions:
  contents: read

concurrency:
  group: cluster-voter-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voter-transition:
    name: Repeated voter transition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Preserve source binding
        shell: bash
        run: |
          mkdir -p target/qualification/voters
          git rev-parse HEAD > target/qualification/voters/source-commit.txt
      - name: Exercise exact generation transition three times without relaxed limits
        shell: bash
        run: |
          for iteration in 1 2 3; do
            cargo test -p kernel \
              cluster_runtime::tests::voter_reconfiguration_is_generation_fenced_and_restart_safe \
              --locked -- --exact --nocapture \
              2>&1 | tee "target/qualification/voters/iteration-${iteration}.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: voter-transition-${{ matrix.os }}-${{ github.sha }}
          path: target/qualification/voters
          retention-days: 30
