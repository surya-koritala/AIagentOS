name: Live provider qualification

# Live contracts are isolated from pull requests because they consume protected
# credentials and provider quota. Missing credentials/endpoints produce an
# explicit not_run evidence record; they are never reported as a pass.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated provider IDs, or all; defaults to AGENTOS_LIVE_PROVIDER_SET
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-provider-qualification
  # A protected-environment approval for stale source must never block the next
  # nightly run. The newest main commit is the only useful qualification target.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AGENTOS_LIVE_PROVIDER_SET: ${{ inputs.providers || vars.AGENTOS_LIVE_PROVIDER_SET }}

jobs:
  qualification-plan:
    name: Fail-closed live-provider dispatch plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_providers: ${{ steps.plan.outputs.has_providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the exact-source provider plan
        id: plan
        run: |
          mkdir -p target/qualification
          python3 scripts/live_provider_qualification_plan.py \
            --providers "$AGENTOS_LIVE_PROVIDER_SET" \
            --commit "$GITHUB_SHA" \
            --output target/qualification/live-provider-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish readiness in the job summary
        if: always()
        run: |
          report=target/qualification/live-provider-plan.json
          if test -f "$report"; then
            {
              printf '### Live-provider qualification plan\n\n'
              printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
              printf -- '- Status: `%s`\n' "$(jq -r .status "$report")"
              printf -- '- Selected providers: `%s`\n' \
                "$(jq -r '.selected_providers | join(",")' "$report")"
              printf -- '- Production claim allowed: `%s`\n' \
                "$(jq -r .production_claim_allowed "$report")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Live-provider qualification plan\n\n- Status: `failed before report publication`\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-provider-plan-${{ github.sha }}
          path: target/qualification/live-provider-plan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require at least one explicitly enabled provider
        run: test "$(jq -r .status target/qualification/live-provider-plan.json)" = "ready"

  fixture-contracts:
    name: Provider fixture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run every adapter fixture and typed-error contract
        run: cargo test -p adapters --all-features --locked

  live-contract:
    name: Live contract (${{ matrix.provider }})
    needs: [qualification-plan, fixture-contracts]
    if: needs.qualification-plan.outputs.has_providers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: provider-qualification
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.matrix) }}
    env:
      QUALIFICATION_PROVIDER: ${{ matrix.provider }}
      QUALIFICATION_MODEL: ${{ vars[matrix.model_variable] }}
      QUALIFICATION_API_KEY: ${{ secrets[matrix.credential_secret] }}
      QUALIFICATION_ENDPOINT: ${{ secrets[matrix.endpoint_secret] }}
      QUALIFICATION_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      QUALIFICATION_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Execute one governed live turn
        run: >-
          timeout 5m cargo run --locked -p adapters
          --example live_provider_qualification
          > "provider-${QUALIFICATION_PROVIDER}.json"
      - name: Publish result in the job summary
        run: |
          status="$(jq -r .status "provider-${QUALIFICATION_PROVIDER}.json")"
          {
            printf '### %s provider qualification\n\n' "$QUALIFICATION_PROVIDER"
            printf -- '- Status: `%s`\n' "$status"
            printf -- '- Evidence artifact: `provider-%s`\n' "$QUALIFICATION_PROVIDER"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = "passed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: provider-${{ matrix.provider }}
          path: provider-${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 30
