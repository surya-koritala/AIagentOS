limitations = ["This is an integrated quorum-backed authority foundation, not a complete production distributed kernel. Strict default-off Raft mode replicates challenged application membership, generation/audit, monotonic ownership leases/tombstones/audit, logical authority time, bounded application-listener certificate rollouts, and exact operation receipts. External authority writes carry a 30-second application-node Ed25519 delegation bound to the authenticated Raft source, active replicated membership, stable operation UUID, semantic command digest, and canonical system-node actor; a minority cannot commit. Quorum-enabled destinations independently perform a linearizable read and accept only the exact active cluster/owner/term/generation/token/expiry revision before fence installation or retirement. Certificate prepare/activation/finalization, generation-fenced voter changes, and separate exact transport-trust generations for learners plus peer leaf/CA rotation are implemented and fail closed. The disabled default retains the legacy single-node authority with term one. These remain coordinated config-driven startup operations, not zero-downtime live administration endpoints. The current proof delegates a system-node principal, not an independently verifiable end-user API-key/session principal; a host that loses both Raft and application private keys remains compromised. Destination verification is online and requires a quorum, not a self-contained offline certificate. Receipt capacity is bounded and fails closed. Before each mutation the client revalidates the live lease and exact destination fence, while work admitted before proof expiry may finish under its retained guard. Creation remains a durably reconciled but non-atomic cross-database sequence. End-user credential delegation, an explicit online-only or offline-certificate destination contract, live administration, workload migration, cross-node IPC, broad partition/clock qualification, global quotas, policy/package trust convergence, rolling upgrades, and disaster recovery remain #122."]

