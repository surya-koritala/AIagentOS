name: Sustained context memory scale

# This hosted synthetic fixture measures the actual context-manager path.
# It is independent of the existing PR-blocking 10k index gate and cannot
# satisfy target-deployment, 24-hour soak or real-provider qualification.
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/retrieval-scale.yml'
      - 'benchmarks/src/bin/memory-qualification.rs'
      - 'benchmarks/src/bin/memory_qualification/**'
      - 'crates/kernel/src/context.rs'
      - 'crates/kernel/src/context/fact_index.rs'
      - 'crates/kernel/src/memory_manager.rs'

permissions:
  contents: read

concurrency:
  group: retrieval-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-scale:
    name: Synthetic 100k context-path fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEMORY_BENCH_MODE: production
      MEMORY_BENCH_ITEMS: '100000'
      MEMORY_BENCH_QUERIES: '100'
      MEMORY_BENCH_SOAK_SECONDS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: false
      - name: Run the actual context-manager path with concurrent mutation
        run: |
          mkdir -p target/qualification
          git rev-parse HEAD > target/qualification/memory-source.txt
          cargo run -p os-benchmark --bin memory-qualification --locked \
            > target/qualification/context-memory-100k.json
      - name: Verify exact-source synthetic scale evidence
        run: |
          jq -e '.schema_version == 3 and .mode == "production-context" and
            .evidence_class == "synthetic-context-scale" and
            .production_claim_allowed == false and .scale_qualification_passed == true and
            .passed == true and .corpus_items == 100000 and .queries == 100 and
            .provider_api_calls == 0 and .source.dirty == false and
            .source.os == "linux" and .traffic.requested_seconds >= 60 and
            .traffic.elapsed_seconds >= 60 and .integrity.missing_facts == 0 and
            .integrity.duplicate_ids == 0 and .traffic.errors == 0' \
            target/qualification/context-memory-100k.json
          test "$(jq -r .source.commit target/qualification/context-memory-100k.json)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: context-memory-100k-${{ github.sha }}
          path: |
            target/qualification/context-memory-100k.json
            target/qualification/memory-source.txt
          if-no-files-found: error
          retention-days: 30
