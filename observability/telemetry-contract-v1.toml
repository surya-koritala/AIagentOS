labels = []

[[metric]]
name = "agentos_llm_cores"
type = "gauge"
unit = "requests"
labels = ["state"]
allowed_label_values = { state = ["in_flight", "waiting", "capacity"] }

[[metric]]
name = "agentos_llm_admitted_total"
type = "counter"
unit = "requests"
labels = []

[[metric]]
name = "agentos_llm_cancelled_total"
type = "counter"
unit = "requests"
labels = []

[[metric]]
name = "agentos_llm_wait_nanoseconds_total"
type = "counter"
unit = "nanoseconds"
labels = []

[[metric]]
name = "agentos_llm_run_nanoseconds_total"
type = "counter"
unit = "nanoseconds"
labels = []

[[metric]]
name = "agentos_quota_storage_healthy"
type = "gauge"
unit = "boolean"
labels = []

