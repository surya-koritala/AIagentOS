name: Combined feature formatting evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-format.yml'
      - 'crates/**'
      - 'tests/**'
      - 'benchmarks/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Retained integration formatting check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain source and any formatter repair
        run: |
          mkdir -p target/qualification/format
          git rev-parse HEAD > target/qualification/format/source-commit.txt
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            git diff --binary > target/qualification/format/rustfmt.patch
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-format-${{ github.sha }}
          path: target/qualification/format
          retention-days: 30
      - name: Require formatted source
        run: test ! -s target/qualification/format/rustfmt.patch
