name: Restricted Phase 1 independent review

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Existing signed annotated vX.Y.Z-rc.N tag
        required: true
        type: string
      environment_id:
        description: Stable target environment identity from campaign.json
        required: true
        type: string
      phase1_campaign_run_id:
        description: Successful authenticated Phase 1 campaign workflow run ID
        required: true
        type: string

concurrency:
  group: phase1-independent-review-${{ inputs.release_candidate }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  AGENTOS_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
  AGENTOS_QUALIFICATION_ENVIRONMENT: ${{ inputs.environment_id }}
  AGENTOS_PHASE1_REVIEW_DIR: ${{ vars.AGENTOS_PHASE1_REVIEW_DIR }}
  PHASE1_CAMPAIGN_RUN_ID: ${{ inputs.phase1_campaign_run_id }}

jobs:
  qualification-plan:
    name: Fail-closed independent-review preflight
    uses: ./.github/workflows/protected-qualification-plan.yml
    with:
      profile: phase1-independent-review
      enabled: ${{ vars.AGENTOS_PHASE1_REVIEW_ENABLED }}

  authenticated-independent-review:
    name: Authenticated exact-RC independent review
    needs: qualification-plan
    if: needs.qualification-plan.outputs.ready == 'true'
    runs-on: [self-hosted, linux, x64, agentos-review]
    timeout-minutes: 20
    environment: phase1-review
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_candidate }}
          fetch-depth: 0
      - name: Validate the authenticated review contracts
        run: |
          python3 scripts/phase1_campaign_provenance.py --validate
          python3 scripts/phase1_independent_review.py --validate
          python3 scripts/phase1_review_provenance.py --validate
      - name: Bind dispatch, annotated tag, checkout, actor, and fresh attempt
        run: |
          [[ "$AGENTOS_RELEASE_CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          [[ "$GITHUB_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/tags/${AGENTOS_RELEASE_CANDIDATE}"
          test "$(git cat-file -t "$AGENTOS_RELEASE_CANDIDATE")" = "tag"
          test "$(git rev-list -n 1 "$AGENTOS_RELEASE_CANDIDATE")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Download the exact authenticated Phase 1 campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PHASE1_CAMPAIGN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          campaign_dir=target/phase1/campaign/artifact
          mkdir -p "$campaign_dir" target/phase1/campaign/metadata
          current="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_CAMPAIGN_RUN_ID}")"
          test "$(jq -r .run_attempt <<<"$current")" = "1"
          test "$(jq -r '.path | split("@")[0]' <<<"$current")" = \
            ".github/workflows/phase1-campaign-assembly.yml"
          test "$(jq -r .event <<<"$current")" = "workflow_dispatch"
          test "$(jq -r .head_sha <<<"$current")" = "$GITHUB_SHA"
          test "$(jq -r .status <<<"$current")" = "completed"
          test "$(jq -r .conclusion <<<"$current")" = "success"
          artifact_name="phase1-campaign-${AGENTOS_RELEASE_CANDIDATE}-${GITHUB_SHA}"
          gh run download "$PHASE1_CAMPAIGN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$campaign_dir"
          python3 scripts/phase1_campaign_provenance.py \
            --campaign "$campaign_dir/campaign.json" \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --plan-output target/phase1/campaign/plan.json
          metadata_file="$(jq -r .run.metadata_file \
            target/phase1/campaign/plan.json)"
          [[ "$metadata_file" =~ ^[1-9][0-9]*-1\.json$ ]]
          gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE1_CAMPAIGN_RUN_ID}/attempts/1" \
            > "target/phase1/campaign/metadata/${metadata_file}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate campaign workflow, bytes, and signature
        run: |
          plan=target/phase1/campaign/plan.json
          metadata_file="$(jq -r .run.metadata_file "$plan")"
          python3 scripts/phase1_campaign_provenance.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --plan "$plan" \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata \
              "target/phase1/campaign/metadata/${metadata_file}" \
            --artifact-dir target/phase1/campaign/artifact \
            --output target/qualification/phase1-campaign-provenance.json
      - name: Require the reviewer-controlled evidence drop
        run: |
          test -n "$AGENTOS_PHASE1_REVIEW_DIR"
          [[ "$AGENTOS_PHASE1_REVIEW_DIR" = /* ]]
          test -d "$AGENTOS_PHASE1_REVIEW_DIR"
          test ! -L "$AGENTOS_PHASE1_REVIEW_DIR"
          review_dir="$(realpath "$AGENTOS_PHASE1_REVIEW_DIR")"
          case "$review_dir" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "Review evidence must remain outside the source checkout" >&2
              exit 1
              ;;
          esac
          for name in phase1-review-observation.json; do
            path="${review_dir}/${name}"
            test -f "$path"
            test ! -L "$path"
          done
      - name: Create the actor-bound independent review
        run: |
          mkdir -p target/qualification
          python3 scripts/phase1_independent_review.py \
            --campaign target/phase1/campaign/artifact/campaign.json \
            --campaign-provenance \
              target/qualification/phase1-campaign-provenance.json \
            --observation \
              "${AGENTOS_PHASE1_REVIEW_DIR}/phase1-review-observation.json" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-candidate "$AGENTOS_RELEASE_CANDIDATE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-environment "$AGENTOS_QUALIFICATION_ENVIRONMENT" \
            --expected-campaign-run-id "$PHASE1_CAMPAIGN_RUN_ID" \
            --output target/qualification/phase1-review.json \
            --require-approved
      - name: Keyless-sign the authenticated review
        run: |
          cosign sign-blob --yes \
            --bundle target/qualification/phase1-review.json.sigstore.json \
            target/qualification/phase1-review.json
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/qualification/phase1-review.json
      - name: Publish bounded review summary
        run: |
          report=target/qualification/phase1-review.json
          {
            printf '### Restricted Phase 1 independent review\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Release candidate: `%s`\n' \
              "$AGENTOS_RELEASE_CANDIDATE"
            printf -- '- Decision: `%s`\n' "$(jq -r .decision "$report")"
            printf -- '- Review attempt: `%s`\n' \
              "$(jq -r .review_workflow.run_attempt "$report")"
            printf -- '- Open findings: `%s`\n' \
              "$(jq '.open_findings | length' "$report")"
            printf -- '- Whole-product production claim: `false`\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase1-independent-review-${{ inputs.release_candidate }}-${{ github.sha }}
          path: |
            target/qualification/phase1-review.json
            target/qualification/phase1-review.json.sigstore.json
          if-no-files-found: error
          retention-days: 90
