[package]
name = "agent-sdk"
version = "0.3.0"
edition = "2021"
description = "Embeddable Rust SDK for building agents against the AI Agent OS kernel over its syscall server."
license.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../kernel", version = "=0.3.0" }
tokio = { workspace = true }
serde_json = { workspace = true }
