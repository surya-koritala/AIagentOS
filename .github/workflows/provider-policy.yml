name: Primary tool policy fixtures

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/provider-policy.yml'
      - 'crates/kernel/src/connector.rs'
      - 'crates/kernel/src/execution.rs'
      - 'crates/kernel/src/config.rs'
      - 'tests/src/provider_policy.rs'

permissions:
  contents: read

concurrency:
  group: primary-tool-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-fixtures:
    name: Primary tool routing policy and governed shim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Format and preserve a repair patch
        run: |
          mkdir -p target/qualification
          if ! cargo fmt --all -- --check; then
            cargo fmt --all
            git diff --binary > target/qualification/rustfmt.patch
          fi
      - name: Kernel policy and existing compatibility fixtures
        run: |
          cargo test -p kernel connector:: --locked
          cargo test -p kernel primary_tool_policy_rejection --locked
      - name: Governed shim and operator policy fixtures
        run: cargo test -p integration-tests provider_policy --locked
      - name: Require formatted source for final evidence
        run: test ! -s target/qualification/rustfmt.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: primary-tool-policy-${{ github.sha }}
          path: target/qualification
          retention-days: 30
