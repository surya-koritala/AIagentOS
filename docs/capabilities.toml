limitations = ["Active prompt and durable context limits use explicit backpressure, not Linux virtual memory. Host RSS and external provider/vector-store caches are outside these counters and remain governed by process/container policy; there is intentionally no OOM victim killer. Page-in is explicit rather than automatic, and lossless storage tests do not claim zero model-quality impact from an immediately compacted prompt."]

