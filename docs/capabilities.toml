# Canonical capability and maturity registry.
#
# This file is the only authoritative source for whether a subsystem is merely
# present, tested, integrated, reachable through the public API, or qualified
# for production. Documentation may explain capabilities, but must not promote
# their maturity independently of this registry.
# `tracking_issue` records the roadmap issue that owns the capability decision.
# If that milestone issue is complete while production qualification remains,
# `qualification_issue` points to the open follow-on. A capability deliberately
# excluded from the v1 promise declares `v1_disposition = "excluded-from-v1"`.

schema_version = 1
updated = "2026-07-23"
model = [
  "scaffolded",
  "unit-tested",
  "integrated",
  "public-api-e2e",
  "production-qualified",
]
maturity_approvers = [
  "capability owner",
  "release-engineering reviewer",
  "security reviewer for security, authorization, isolation, or data-boundary capabilities",
]
verification_commands = [
  "cargo test --workspace --exclude tauri-app --locked",
  "cargo clippy --workspace --exclude tauri-app --all-targets -- -D warnings",
  "cargo run --package os-benchmark --bin os-benchmark",
]

