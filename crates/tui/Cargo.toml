[package]
name = "agent-tui"
version = "0.4.0-rc.1"
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Rust terminal UI for observing and driving AI Agent OS over the syscall server"

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[dependencies]
agent-sdk = { path = "../sdk", version = "=0.4.0-rc.1" }
tokio = { workspace = true }
serde_json = { workspace = true }
ratatui = "0.30.2"

[dev-dependencies]
kernel = { path = "../kernel", version = "=0.4.0-rc.1" }
