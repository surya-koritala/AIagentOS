name: Destination authority preflight

on:
  push:
    branches: [codex/destination-authority-online]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain exact hosted formatting
        run: |
          git rev-parse HEAD > destination-format-source.txt
          cargo fmt --all
          git diff --binary > destination-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: destination-format-${{ github.run_id }}
          path: |
            destination-format-source.txt
            destination-format.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code
  proof:
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Compile every public consumer
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > destination-source.txt
          cargo check -p kernel -p agent-sdk -p agent-cli -p agent-tui --all-targets --locked 2>&1 | tee destination-check.log
      - name: Independent signature and exact active scope proofs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kernel --lib --locked destination_ -- --nocapture 2>&1 | tee destination-proof.log
          cargo test -p agent-sdk --test destination_contract --locked -- --nocapture 2>&1 | tee destination-sdk.log
          cargo test -p kernel --lib --locked wire_contract::tests -- --nocapture 2>&1 | tee destination-wire.log
          python -m unittest scripts.tests.test_verify_wire_fixtures 2>&1 | tee destination-python.log
          cargo test -p integration-tests --locked capability_registry -- --nocapture 2>&1 | tee destination-registry.log
          cargo clippy -p kernel --all-targets --locked -- -D warnings 2>&1 | tee destination-clippy.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: destination-preflight-${{ github.run_id }}
          path: |
            destination-source.txt
            destination-check.log
            destination-proof.log
            destination-sdk.log
            destination-wire.log
            destination-python.log
            destination-registry.log
            destination-clippy.log
          retention-days: 30
