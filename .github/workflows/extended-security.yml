name: Extended security tests

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The repository pins stable Rust for normal builds. Security instrumentation
  # must explicitly override that repository-level toolchain selection.
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

concurrency:
  group: extended-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-fault-matrix:
    name: Exact-commit deterministic fault matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep the release fixture on the repository's supported stable
      # toolchain even though the instrumentation jobs below require nightly.
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Validate fault fixture contract
        run: >-
          cargo run --release --locked --package os-benchmark
          --bin resilience-qualification -- --validate
      - name: Exercise every deterministic fault and recovery path
        run: |
          mkdir -p target/qualification
          cargo run --release --locked --package os-benchmark \
            --bin resilience-qualification -- \
            --all --output target/qualification/deterministic-fault-matrix.json
      - name: Verify exact-source fault evidence
        run: |
          report=target/qualification/deterministic-fault-matrix.json
          test "$(jq -r .schema_version "$report")" = "1"
          test "$(jq -r .qualification_class "$report")" = "deterministic_resilience_fixture"
          test "$(jq -r .passed "$report")" = "true"
          test "$(jq -r .production_claim_allowed "$report")" = "false"
          test "$(jq -r .build_profile "$report")" = "release"
          test "$(jq -r .smoke_scaled "$report")" = "false"
          test "$(jq -r .source.commit "$report")" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty "$report")" = "false"
          jq -e '
            [.scenarios[].name] == [
              "turn-overload",
              "slow-clients",
              "provider-outage",
              "cancellation-storm",
              "disk-full",
              "database-lock",
              "network-partition"
            ]
            and all(.scenarios[]; .passed == true)
            and all(.scenarios[].checks[]; . == true)
            and (
              .scenarios[]
              | select(.name == "turn-overload")
              | .checks.provider_backpressure_peak_rss_bounded == true
                and .checks.provider_backpressure_steady_rss_bounded == true
                and .observed.memory_waves >= 4
                and .observed.rss_samples >= 5
            )
            and (
              .scenarios[]
              | select(.name == "slow-clients")
              | .checks.slow_client_peak_rss_bounded == true
                and .checks.slow_client_steady_rss_bounded == true
                and .observed.memory_waves >= 4
                and .observed.rss_samples >= 5
            )
          ' "$report"
      - name: Retain deterministic fault qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-fault-matrix-${{ github.sha }}
          path: target/qualification/deterministic-fault-matrix.json
          if-no-files-found: error
          retention-days: 90

  rootless-container-sandbox:
    name: Rootless container sandbox breakout and cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.6.2
          rootless: true
          daemon-config: |
            {
              "exec-opts": ["native.cgroupdriver=cgroupfs"]
            }
      - name: Verify rootless daemon and pull immutable qualification image
        env:
          QUALIFICATION_IMAGE: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
        run: |
          docker info --format '{{json .SecurityOptions}}' | grep -qi rootless
          docker pull "${QUALIFICATION_IMAGE}"
          echo "AGENTOS_SANDBOX_TEST_IMAGE=${QUALIFICATION_IMAGE}" >> "$GITHUB_ENV"
      - name: Exercise live breakout, cancellation, and crash cleanup
        env:
          # Rust test processes run from the package directory, so use an
          # absolute workspace path that the following workflow steps share.
          AGENTOS_SANDBOX_EVIDENCE_PATH: ${{ github.workspace }}/target/qualification/rootless-sandbox-crash.json
        run: |
          mkdir -p target/qualification
          cargo test -p kernel \
            docker_sandbox::tests::live_rootless_container_blocks_escape_and_cleans_cancellation_and_crash \
            --locked -- --ignored --exact --nocapture
      - name: Verify exact-source sandbox evidence
        run: |
          test "$(jq -r .passed target/qualification/rootless-sandbox-crash.json)" = "true"
          test "$(jq -r .production_claim_allowed target/qualification/rootless-sandbox-crash.json)" = "false"
          test "$(jq -r .qualification_class target/qualification/rootless-sandbox-crash.json)" = "live_rootless_linux_sandbox"
          test "$(jq -r .source.commit target/qualification/rootless-sandbox-crash.json)" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty target/qualification/rootless-sandbox-crash.json)" = "false"
          test "$(jq -r .environment.image target/qualification/rootless-sandbox-crash.json)" = "$AGENTOS_SANDBOX_TEST_IMAGE"
          test "$(jq '[.checks[] | select(. == true)] | length' target/qualification/rootless-sandbox-crash.json)" = "12"
      - name: Retain rootless sandbox qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootless-sandbox-crash-${{ github.sha }}
          path: target/qualification/rootless-sandbox-crash.json
          if-no-files-found: error
          retention-days: 90

  network-egress:
    name: Live network SSRF and DNS-rebinding controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Exercise a controlled live egress topology
        env:
          AGENTOS_NETWORK_TEST_HOST: rebind.agentos.invalid
          AGENTOS_NETWORK_PUBLIC_ADDRESS: 11.0.0.1:80
          AGENTOS_NETWORK_PRIVATE_ADDRESS: 127.0.0.1:80
          AGENTOS_NETWORK_SWITCH_READY: ${{ github.workspace }}/target/qualification/network-switch-ready
          AGENTOS_NETWORK_SWITCH_COMPLETE: ${{ github.workspace }}/target/qualification/network-switch-complete
          AGENTOS_NETWORK_EVIDENCE_PATH: ${{ github.workspace }}/target/qualification/network-egress.json
        run: |
          set -euo pipefail
          mkdir -p target/qualification
          hosts_backup="$(mktemp)"
          original_unprivileged_port_start="$(sysctl -n net.ipv4.ip_unprivileged_port_start)"
          sudo cp /etc/hosts "${hosts_backup}"
          cleanup() {
            sudo cp "${hosts_backup}" /etc/hosts
            sudo ip address delete 11.0.0.1/32 dev lo >/dev/null 2>&1 || true
            sudo sysctl -q -w "net.ipv4.ip_unprivileged_port_start=${original_unprivileged_port_start}" || true
            rm -f "${hosts_backup}"
          }
          trap cleanup EXIT
          sudo ip address add 11.0.0.1/32 dev lo
          sudo sysctl -q -w net.ipv4.ip_unprivileged_port_start=0
          printf '11.0.0.1 rebind.agentos.invalid\n' | sudo tee -a /etc/hosts >/dev/null
          cargo test -p kernel --features qualification \
            sandbox::tests::live_network_egress_blocks_ssrf_redirects_and_dns_rebinding \
            --locked --no-run
          (
            for _ in $(seq 1 400); do
              if test -f "${AGENTOS_NETWORK_SWITCH_READY}"; then
                break
              fi
              sleep 0.025
            done
            test -f "${AGENTOS_NETWORK_SWITCH_READY}"
            grep -v 'rebind.agentos.invalid' /etc/hosts > target/qualification/hosts-rebound
            printf '127.0.0.1 rebind.agentos.invalid\n' >> target/qualification/hosts-rebound
            sudo cp target/qualification/hosts-rebound /etc/hosts
            touch "${AGENTOS_NETWORK_SWITCH_COMPLETE}"
          ) &
          switch_pid=$!
          env HTTP_PROXY=http://127.0.0.1:80 CARGO_NET_OFFLINE=true \
            cargo test -p kernel --features qualification \
            sandbox::tests::live_network_egress_blocks_ssrf_redirects_and_dns_rebinding \
            --locked -- --ignored --exact --nocapture
          wait "${switch_pid}"
      - name: Verify exact-source network evidence
        run: |
          report=target/qualification/network-egress.json
          test "$(jq -r .schema_version "${report}")" = "1"
          test "$(jq -r .passed "${report}")" = "true"
          test "$(jq -r .production_claim_allowed "${report}")" = "false"
          test "$(jq -r .qualification_class "${report}")" = "live_linux_network_egress"
          test "$(jq -r .source.commit "${report}")" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty "${report}")" = "false"
          test "$(jq -r .environment.ambient_proxy_configured "${report}")" = "true"
          test "$(jq '[.checks[] | select(. == true)] | length' "${report}")" = "10"
      - name: Retain live network qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-egress-${{ github.sha }}
          path: target/qualification/network-egress.json
          if-no-files-found: error
          retention-days: 90

  provider-core:
    name: Provider core live-path security controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: crates/tauri-app/ui/package-lock.json
      - name: Install the lockfile-pinned Chromium qualification runtime
        working-directory: crates/tauri-app/ui
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Allow Chromium's user-namespace sandbox through AppArmor
        run: |
          set -euo pipefail
          browser_executable="$(
            find "${HOME}/.cache/ms-playwright" -type f \
              -name chrome-headless-shell -perm -u+x -print -quit
          )"
          test -n "${browser_executable}"
          profile=/etc/apparmor.d/agentos-chromium-qualification
          {
            printf 'abi <abi/4.0>,\n\n'
            printf 'include <tunables/global>\n\n'
            printf '%s flags=(unconfined) {\n' "${browser_executable}"
            printf '  userns,\n'
            printf '}\n'
          } | sudo tee "${profile}" >/dev/null
          sudo apparmor_parser -r "${profile}"
          sudo grep -F "${browser_executable} (unconfined)" \
            /sys/kernel/security/apparmor/profiles
          printf 'AGENTOS_QUALIFICATION_CHROME=%s\n' "${browser_executable}" \
            >> "${GITHUB_ENV}"
          printf 'AGENTOS_QUALIFICATION_APPARMOR_PROFILE=%s\n' "${profile}" \
            >> "${GITHUB_ENV}"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Exercise exact live provider and trusted-browser paths
        run: |
          set -euo pipefail
          mkdir -p target/qualification/provider-core-logs
          run_exact() {
            package="$1"
            test_name="$2"
            log_name="$3"
            cargo test -p "$package" --locked "$test_name" \
              -- --exact --nocapture 2>&1 \
              | tee "target/qualification/provider-core-logs/${log_name}.log"
          }
          run_exact kernel \
            sandbox::tests::capability_file_create_and_replace_are_atomic_private_and_bounded \
            filesystem-atomic
          run_exact kernel \
            sandbox::tests::capability_io_blocks_a_symlink_swap_after_authorization \
            filesystem-race
          run_exact kernel \
            sandbox::tests::capability_io_rejects_cross_agent_workspace_access \
            cross-agent
          run_exact kernel \
            resources::tests::provider_panic_is_redacted_and_releases_admission_permit \
            provider-panic
          run_exact kernel \
            resources::tests::broker_rejects_unbounded_requests_responses_and_error_diagnostics \
            resource-envelope
          run_exact integration-tests \
            sandbox_surfaces::wire_sdk_package_custom_and_mcp_calls_share_the_fail_closed_sandbox \
            cross-surface
          run_exact integration-tests \
            capability_registry::provider_matrix_names_every_resource_provider_status_and_platform_contract \
            provider-matrix
          browser_test=playwright::tests::live_browser_denies_downloads_isolates_sessions_and_removes_profiles
          browser_executable="${AGENTOS_QUALIFICATION_CHROME}"
          browser_profile="${AGENTOS_QUALIFICATION_APPARMOR_PROFILE}"
          test -x "${browser_executable}"
          test -f "${browser_profile}"
          {
            printf 'browser_sha256=%s\n' "$(sha256sum "${browser_executable}" | cut -d ' ' -f 1)"
            printf 'browser_userns_profile_sha256=%s\n' \
              "$(sha256sum "${browser_profile}" | cut -d ' ' -f 1)"
            printf 'browser_sandbox=userns_apparmor_profile\n'
            "${browser_executable}" --version
            env AGENTOS_TEST_CHROME="${browser_executable}" \
              cargo test -p resources --features browser --locked "${browser_test}" \
              -- --ignored --exact --nocapture
          } 2>&1 | tee target/qualification/provider-core-logs/browser-profile.log
      - name: Derive exact-source core provider evidence from test events
        run: |
          grep -Eq '^browser_sha256=[0-9a-f]{64}$' \
            target/qualification/provider-core-logs/browser-profile.log
          grep -Eq '^browser_userns_profile_sha256=[0-9a-f]{64}$' \
            target/qualification/provider-core-logs/browser-profile.log
          grep -Fx 'browser_sandbox=userns_apparmor_profile' \
            target/qualification/provider-core-logs/browser-profile.log
          grep -Eq '^(Google Chrome for Testing|Chromium) [0-9]' \
            target/qualification/provider-core-logs/browser-profile.log
          python3 scripts/provider_core_qualification.py \
            --commit "$GITHUB_SHA" \
            --output target/qualification/provider-core.json \
            --evidence filesystem_atomic_private_bounded,sandbox::tests::capability_file_create_and_replace_are_atomic_private_and_bounded,target/qualification/provider-core-logs/filesystem-atomic.log \
            --evidence filesystem_symlink_and_race_denied,sandbox::tests::capability_io_blocks_a_symlink_swap_after_authorization,target/qualification/provider-core-logs/filesystem-race.log \
            --evidence cross_agent_filesystem_denied,sandbox::tests::capability_io_rejects_cross_agent_workspace_access,target/qualification/provider-core-logs/cross-agent.log \
            --evidence provider_panic_isolated,resources::tests::provider_panic_is_redacted_and_releases_admission_permit,target/qualification/provider-core-logs/provider-panic.log \
            --evidence resource_envelope_bounded,resources::tests::broker_rejects_unbounded_requests_responses_and_error_diagnostics,target/qualification/provider-core-logs/resource-envelope.log \
            --evidence cross_surface_sandbox_consistent,sandbox_surfaces::wire_sdk_package_custom_and_mcp_calls_share_the_fail_closed_sandbox,target/qualification/provider-core-logs/cross-surface.log \
            --evidence kernel_browser_provider_unavailable,capability_registry::provider_matrix_names_every_resource_provider_status_and_platform_contract,target/qualification/provider-core-logs/provider-matrix.log \
            --evidence browser_profiles_isolated_and_cleaned,playwright::tests::live_browser_denies_downloads_isolates_sessions_and_removes_profiles,target/qualification/provider-core-logs/browser-profile.log
      - name: Verify exact-source core provider evidence
        run: |
          report=target/qualification/provider-core.json
          test "$(jq -r .schema_version "$report")" = "2"
          test "$(jq -r .passed "$report")" = "true"
          test "$(jq -r .production_claim_allowed "$report")" = "false"
          test "$(jq -r .qualification_class "$report")" = "live_linux_provider_security_core"
          test "$(jq -r .source.commit "$report")" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty "$report")" = "false"
          test "$(jq '[.checks[] | select(. == true)] | length' "$report")" = "8"
          test "$(jq '.evidence | length' "$report")" = "8"
          jq -e 'all(.evidence[]; .sha256 | test("^[0-9a-f]{64}$"))' "$report"
      - name: Retain core provider qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-core-${{ github.sha }}
          path: |
            target/qualification/provider-core.json
            target/qualification/provider-core-logs
          if-no-files-found: error
          retention-days: 90

  provider-security-suite:
    name: Aggregate exact-commit provider security suite
    needs:
      - rootless-container-sandbox
      - network-egress
      - provider-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootless-sandbox-crash-${{ github.sha }}
          path: target/qualification/source/rootless
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: network-egress-${{ github.sha }}
          path: target/qualification/source/network
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-core-${{ github.sha }}
          path: target/qualification/source/core
      - name: Aggregate independently executed provider controls
        run: |
          set -euo pipefail
          rootless=target/qualification/source/rootless/rootless-sandbox-crash.json
          network=target/qualification/source/network/network-egress.json
          core=target/qualification/source/core/provider-core.json
          for report in "$rootless" "$network" "$core"; do
            test "$(jq -r .passed "$report")" = "true"
            test "$(jq -r .production_claim_allowed "$report")" = "false"
            test "$(jq -r .source.commit "$report")" = "$GITHUB_SHA"
            test "$(jq -r .source.dirty "$report")" = "false"
          done
          rootless_sha="$(sha256sum "$rootless" | cut -d ' ' -f 1)"
          network_sha="$(sha256sum "$network" | cut -d ' ' -f 1)"
          core_sha="$(sha256sum "$core" | cut -d ' ' -f 1)"
          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg rootless_sha "$rootless_sha" \
            --arg network_sha "$network_sha" \
            --arg core_sha "$core_sha" \
            --slurpfile rootless "$rootless" \
            --slurpfile network "$network" \
            --slurpfile core "$core" \
            '{
              schema_version: 1,
              suite: "agentos-v1-provider-security-suite",
              generated_at: $generated_at,
              qualification_class: "combined_live_linux_provider_security",
              production_claim_allowed: false,
              source: {
                commit: $commit,
                dirty: (
                  $rootless[0].source.dirty
                  or $network[0].source.dirty
                  or $core[0].source.dirty
                )
              },
              components: {
                rootless: {
                  qualification_class: $rootless[0].qualification_class,
                  evidence_sha256: $rootless_sha
                },
                network: {
                  qualification_class: $network[0].qualification_class,
                  evidence_sha256: $network_sha
                },
                core: {
                  qualification_class: $core[0].qualification_class,
                  evidence_sha256: $core_sha
                }
              },
              checks: {
                injection_literal_argv: $rootless[0].checks.literal_argv_no_implicit_shell,
                traversal_and_symlink_race: $core[0].checks.filesystem_symlink_and_race_denied,
                ssrf_metadata_denied: $network[0].checks.metadata_ssrf_denied,
                redirect_not_followed: $network[0].checks.redirect_not_followed,
                dns_rebinding_denied: $network[0].checks.dns_rebinding_denied,
                large_output_bounded: $rootless[0].checks.stdout_limit_enforced,
                hung_process_cleaned: $rootless[0].checks.hung_process_cleanup,
                browser_profiles_isolated_and_cleaned: $core[0].checks.browser_profiles_isolated_and_cleaned,
                kernel_browser_provider_unavailable: $core[0].checks.kernel_browser_provider_unavailable,
                cross_agent_access_denied: $core[0].checks.cross_agent_filesystem_denied,
                provider_panic_isolated: $core[0].checks.provider_panic_isolated,
                resource_envelope_bounded: $core[0].checks.resource_envelope_bounded,
                cross_surface_sandbox_consistent: $core[0].checks.cross_surface_sandbox_consistent
              },
              passed: (
                all($rootless[0].checks[]; . == true)
                and all($network[0].checks[]; . == true)
                and all($core[0].checks[]; . == true)
              )
            }' > target/qualification/provider-security-suite.json
      - name: Verify combined provider security evidence
        run: |
          report=target/qualification/provider-security-suite.json
          test "$(jq -r .passed "$report")" = "true"
          test "$(jq -r .production_claim_allowed "$report")" = "false"
          test "$(jq -r .qualification_class "$report")" = "combined_live_linux_provider_security"
          test "$(jq -r .source.commit "$report")" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty "$report")" = "false"
          test "$(jq '[.checks[] | select(. == true)] | length' "$report")" = "13"
          test "$(jq '.components | length' "$report")" = "3"
          jq -e 'all(.components[]; .evidence_sha256 | test("^[0-9a-f]{64}$"))' "$report"
      - name: Retain combined provider security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-security-suite-${{ github.sha }}
          path: target/qualification/provider-security-suite.json
          if-no-files-found: error
          retention-days: 90

  miri:
    name: Miri (unsafe/concurrency smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
          components: miri
      - run: cargo miri setup
      - name: Exercise in-memory policy and isolation code under Miri
        env:
          # These audit tests read wall-clock time; Miri still checks memory
          # safety and concurrency while allowing that deterministic host call.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri test -p kernel cgroups::tests
          cargo miri test -p kernel permissions::tests

  address-sanitizer:
    name: Address sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
      - name: Run deterministic security-critical tests under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo test -p kernel --target x86_64-unknown-linux-gnu cgroups::tests -- --test-threads=1
          cargo test -p kernel --target x86_64-unknown-linux-gnu permissions::tests -- --test-threads=1
          cargo test -p kernel --target x86_64-unknown-linux-gnu auth::tests -- --test-threads=1
          cargo test -p kernel --target x86_64-unknown-linux-gnu syscall_gate::tests -- --test-threads=1

  fuzz:
    name: Wire-protocol fuzz smoke
    runs-on: ubuntu-latest
    # A cold hosted runner can spend more than 11 minutes compiling both
    # libFuzzer targets; retain enough time for both bounded 120-second runs
    # and evidence publication.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-20
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build every fuzz target
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Exercise untrusted wire input
        run: cargo fuzz run wire_syscall --target x86_64-unknown-linux-gnu -- -max_total_time=120 -max_len=65536
      - name: Exercise partial and out-of-order transport fragments
        run: cargo fuzz run wire_transport --target x86_64-unknown-linux-gnu -- -max_total_time=120 -max_len=262144
      - name: Preserve newly discovered corpus and crash evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wire-fuzz-evidence
          path: |
            fuzz/corpus/wire_syscall
            fuzz/artifacts/wire_syscall
            fuzz/corpus/wire_transport
            fuzz/artifacts/wire_transport
          if-no-files-found: warn
