name: Operator onboarding evidence

on:
  push:
    branches: [codex/operator-onboarding]
  pull_request:
    branches: [main]
    paths:
      - 'crates/kernel/src/auth.rs'
      - 'crates/kernel/src/lib.rs'
      - 'crates/kernel/src/syscall_server.rs'
      - 'crates/kernel/src/identity_admin_tests.rs'
      - 'crates/sdk/**'
      - 'crates/cli/**'
      - 'docs/SERVER_QUICKSTART.md'
      - '.github/workflows/operator-onboarding.yml'

permissions:
  contents: read

concurrency:
  group: operator-onboarding-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  formatting:
    name: Operator source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Generate formatting diagnostic patch on CI
        run: |
          cargo fmt --all
          git diff --binary > operator-formatting.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operator-formatting-${{ github.run_id }}
          path: operator-formatting.patch
      - name: Formatting must match the committed source
        run: git diff --exit-code

  onboarding:
    name: Shipped binary tenant and agent onboarding
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: false
      - name: Bind evidence to the exact checked-out source
        run: |
          git rev-parse HEAD > operator-source.txt
          git status --porcelain >> operator-source.txt
      - name: Wire roles, tenant scope, revocation, schema, and redaction
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kernel identity_admin_tests --locked -- --nocapture 2>&1 | tee operator-wire.log
          cargo test -p kernel wire_contract --locked 2>&1 | tee operator-contract.log
      - name: First operator, multiple isolated agents, quotas, and process restart
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-cli --test identity_commands --locked -- --nocapture 2>&1 | tee operator-binaries.log
          cargo test -p integration-tests capability_registry --locked 2>&1 | tee operator-capabilities.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operator-onboarding-${{ github.run_id }}
          path: |
            operator-source.txt
            operator-*.log
          if-no-files-found: error
