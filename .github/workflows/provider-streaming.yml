name: Provider streaming conformance

on:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'crates/adapters/**'
      - 'crates/kernel/src/connector.rs'
      - 'crates/kernel/src/model_discovery*.rs'
      - 'crates/kernel/src/syscall_server.rs'
      - 'crates/kernel/src/wire_contract.rs'
      - 'crates/sdk/**'
      - 'crates/cli/**'
      - 'protocol/**'
      - 'scripts/verify_wire_fixtures.py'
      - 'scripts/tests/test_verify_wire_fixtures.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/provider-streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-streaming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  conformance:
    name: All-feature provider streaming fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: false
      - name: Formatting gate and CI repair artifact
        shell: bash
        run: |
          if cargo fmt --all -- --check > rustfmt-check.txt 2>&1; then
            cat rustfmt-check.txt
          else
            cat rustfmt-check.txt
            cargo fmt --all
            git diff --binary > rustfmt.patch
            exit 1
          fi
      - name: Versioned operation-set conformance without provider calls
        run: python -m unittest discover -s scripts/tests -p 'test_verify_wire_fixtures.py'
      - name: Early bounded model discovery and capability contracts
        run: cargo test -p adapters --all-features --locked model_discovery
      - name: System-only catalog authorization and third-party bounds
        run: |
          cargo test -p kernel --locked model_discovery
          cargo test -p kernel --locked syscall_server::tests::authorization_policy_classifies_every_syscall_and_agent_resource -- --exact
      - name: Actual operator wire, SDK and agentctl model discovery
        run: |
          cargo test -p agent-sdk --test model_discovery --locked
          cargo test -p agent-cli --test model_discovery_commands --locked
      - name: Early local NDJSON and controlled decoder contracts
        run: cargo test -p adapters --all-features --locked local_streaming_tests
      - name: Controlled blocking worker cancellation and cleanup
        run: cargo test -p adapters --all-features --locked on_device::tests::controlled_
      - name: Protected real-model qualification contract without model execution
        run: cargo test -p adapters --all-features --examples --locked
      - name: Early streamed history through the governed executor
        run: cargo test -p integration-tests streamed_native --locked
      - name: All adapter and native-stream contracts without provider credentials
        run: cargo test -p adapters --all-features --locked
      - name: Retain exact-source fixture results and formatting diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-streaming-diagnostics-${{ github.sha }}
          path: |
            rustfmt-check.txt
            rustfmt.patch
          if-no-files-found: error
          retention-days: 14
