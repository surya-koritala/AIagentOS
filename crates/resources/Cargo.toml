[package]
name = "resources"
version = "0.4.0-rc.1"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[features]
# Default lean: kernel + filesystem + network + one-shot application launch.
# Heavy web tooling is opt-in.
default = []
# Headless browser automation (chromiumoxide, ~50 MB compiled).
browser = ["dep:chromiumoxide", "dep:futures", "dep:tempfile"]
# HTML parsing (scraper, ~3 MB compiled).
web = ["dep:scraper", "dep:futures"]

[dependencies]
kernel = { path = "../kernel", version = "=0.4.0-rc.1" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true, optional = true }
urlencoding = "2"
chromiumoxide = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
