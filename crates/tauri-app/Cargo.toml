[package]
name = "tauri-app"
version = "0.3.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tauri-app"
path = "src/main.rs"
required-features = ["desktop-shell"]

[features]
default = ["desktop-shell"]
desktop-shell = [
    "dep:agent-cli",
    "dep:keyring",
    "dep:tauri",
    "dep:tauri-build",
    "dep:zeroize",
]

[dependencies]
kernel = { path = "../kernel", version = "=0.3.0" }
agent-sdk = { path = "../sdk", version = "=0.3.0" }
agent-cli = { path = "../cli", version = "=0.3.0", optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tauri = { workspace = true, optional = true }
tracing = { workspace = true }
zeroize = { workspace = true, optional = true }
keyring = { version = "=4.1.5", optional = true }

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio-util = { workspace = true }
