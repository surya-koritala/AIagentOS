[[capability]]
id = "context-pressure"
title = "Durable context spill and pressure handling"
owner = "runtime"
maturity = "production-qualified"
release = "v0.5"
tracking_issue = 115
kernel_modules = ["context", "context_paging"]
source_paths = ["crates/kernel/src/context.rs", "crates/kernel/src/context_paging.rs", "crates/kernel/src/execution.rs", "crates/kernel/src/config.rs", "docs/CONTEXT_PRESSURE.md"]
