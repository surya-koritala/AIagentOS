name: SLI metric source conformance

on:
  push:
    branches: [codex/sli-metric-sources]
    paths:
      - 'crates/kernel/src/**'
      - 'crates/cli/src/bin/agent-server.rs'
      - 'observability/telemetry-contract-v2.toml'
      - 'docs/OBSERVABILITY.md'
      - '.github/workflows/sli-metric-sources.yml'
  pull_request:
    paths:
      - 'crates/kernel/src/telemetry.rs'
      - 'crates/kernel/src/metrics.rs'
      - 'observability/telemetry-contract-v2.toml'
      - '.github/workflows/sli-metric-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sli-metric-sources-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: SLI source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Retain exact hosted formatter output
        run: |
          git rev-parse HEAD > sli-source.txt
          cargo fmt --all
          git diff --binary > sli-rustfmt.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sli-source-format-${{ github.run_id }}
          path: |
            sli-source.txt
            sli-rustfmt.patch
          retention-days: 30
      - name: Require committed formatting
        run: git diff --exit-code

  sources:
    name: Six SLI sources (${{ matrix.os }})
    needs: formatting
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      OPENSSL_SRC_PERL: ${{ matrix.os == 'windows-latest' && 'C:/Strawberry/perl/bin/perl.exe' || 'perl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - name: Actual source, drop, denial, recovery and HTTP contracts
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > sli-source.txt
          for filter in telemetry:: metrics:: execution:: rate_limit:: syscall_gate:: checkpoint_recovery_sli explicit_tenant_sli; do
            cargo test -p kernel --lib --locked "$filter" -- --nocapture 2>&1 | tee -a sli-source-tests.log
          done
          cargo test -p agent-cli --bin agent-server --locked metrics_http_endpoint_serves_exposition_and_404s -- --nocapture 2>&1 | tee -a sli-source-tests.log
          cargo test -p integration-tests --locked client_metrics_parity -- --nocapture 2>&1 | tee -a sli-source-tests.log
      - name: Strict source and fixture warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p kernel -p agent-cli -p integration-tests --all-targets --locked -- -D warnings 2>&1 | tee sli-source-clippy.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sli-source-${{ runner.os }}-${{ github.run_id }}
          path: |
            sli-source.txt
            sli-source-tests.log
            sli-source-clippy.log
          retention-days: 30
          if-no-files-found: error
