name: Release dependency negative probes

on:
  push:
    branches: [codex/release-dependency-probes]

permissions:
  contents: read

jobs:
  source-contract:
    name: Negative probes bind unchanged release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Require exact release implementation and harness ancestry
        run: |
          test "$(git rev-parse HEAD^)" = e4bc58a5418bc5f6d886211e17966f305a564167
          git diff --exit-code HEAD^ HEAD -- \
            .github/workflows/release.yml \
            .github/workflows/release-assets-scenario.yml \
            scripts/prepare_release_bundle.py \
            scripts/build_desktop_update_manifest.py
          python3 -m unittest discover -s scripts/tests -p test_release_asset_workflow.py -v

  negative-scenarios:
    name: Expected dependency failure (${{ matrix.scenario }})
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop-failed, required-ci-failed, wedge-failed, release-artifacts-failed, container-failed]
    uses: ./.github/workflows/release-assets-scenario.yml
    with:
      scenario: ${{ matrix.scenario }}
